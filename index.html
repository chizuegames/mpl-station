<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MPL - Estación Espacial</title>


<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #050713;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
  touch-action: manipulation;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

#game {
  position: relative;
  width: min(100vw, 760px);
  margin: 0 auto;
  overflow: hidden;
  background: #050713;

  user-select: none;
  -webkit-user-select: none;
}

#map {
  position: relative;
  width: 100%;
}

#mapImage {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}


/* =========================================================
   BOTÓN DE MÚSICA
   ========================================================= */

#musicButton {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 70;

  min-height: 44px;

  padding: 8px 14px;

  border: 2px solid #a8d336;
  border-radius: 24px;

  background: rgba(10, 15, 20, 0.88);

  color: white;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 0 0 2px rgba(0,0,0,0.45),
    0 0 12px rgba(168,211,54,0.25);

  transition:
    transform 0.15s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}

#musicButton:active {
  transform: scale(0.94);
}

#musicButton.music-on {
  background: rgba(130,170,30,0.92);

  box-shadow:
    0 0 0 2px rgba(0,0,0,0.45),
    0 0 18px rgba(168,211,54,0.7);
}


/* =========================================================
   ZONAS TOCABLES DE LAS HABITACIONES
   ========================================================= */

.room {
  position: absolute;
  z-index: 20;
  cursor: pointer;
}


/* A12 */

#roomA12 {
  left: 43.0%;
  top: 61.4%;
  width: 15.2%;
  height: 7.6%;
}


/* B5 */

#roomB5 {
  left: 43.0%;
  top: 51.7%;
  width: 15.2%;
  height: 7.6%;
}


/* B6 */

#roomB6 {
  left: 26.0%;
  top: 61.4%;
  width: 14.8%;
  height: 7.6%;
}


/* B7 */

#roomB7 {
  left: 60.2%;
  top: 61.4%;
  width: 14.8%;
  height: 7.6%;
}


/* =========================================================
   BOTÓN DEL ESCÁNER
   ========================================================= */

#scannerButton {
  position: absolute;

  left: 38%;
  top: 89.3%;

  width: 24%;
  height: 8.9%;

  z-index: 25;

  cursor: pointer;

  animation:
    scannerPulse
    1.8s
    infinite
    ease-in-out;
}

@keyframes scannerPulse {

  0%,
  100% {
    filter: brightness(1);
  }

  50% {
    filter: brightness(1.2);
  }

}


/* Cuando el escáner está encendido */

#scannerButton.scanner-on {
  filter:
    brightness(1.3)
    drop-shadow(0 0 10px #a8d336);

  animation:
    scannerActivePulse
    0.9s
    infinite
    ease-in-out;
}

@keyframes scannerActivePulse {

  0%,
  100% {
    filter:
      brightness(1.15)
      drop-shadow(0 0 5px #a8d336);
  }

  50% {
    filter:
      brightness(1.4)
      drop-shadow(0 0 15px #a8d336);
  }

}


/* =========================================================
   CAPA DE ICONOS
   ========================================================= */

#iconsLayer {
  position: absolute;
  inset: 0;

  z-index: 30;

  pointer-events: none;
}

.map-icon {
  position: absolute;
  pointer-events: none;
  object-fit: contain;
}


/* =========================================================
   CENTROS DE HABITACIONES
   ========================================================= */

.pos-A12 {
  left: 50.6%;
  top: 65.2%;
}

.pos-B5 {
  left: 50.5%;
  top: 55.5%;
}

.pos-B6 {
  left: 33.4%;
  top: 65.1%;
}

.pos-B7 {
  left: 67.7%;
  top: 65.1%;
}


/* =========================================================
   ICONO DEL JUGADOR
   ========================================================= */

.player-icon {
  width: 13%;

  transform:
    translate(-50%, -50%);

  animation:
    playerAppear
    0.4s
    ease-out;

  filter:
    drop-shadow(
      0 0 8px
      rgba(255,255,255,0.35)
    );
}

@keyframes playerAppear {

  from {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(0.4);
  }

  to {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

}


/* =========================================================
   MARCIANOS
   ========================================================= */

.enemy-icon {
  width: 12.5%;

  transform:
    translate(-50%, -50%);

  animation:
    enemyAppear
    0.35s
    ease-out;
}

@keyframes enemyAppear {

  from {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(0.2);
  }

  to {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

}


/* =========================================================
   CHECK DE SALA REVISADA
   ========================================================= */

.check-icon {
  width: 11.5%;

  transform:
    translate(-50%, -50%);

  animation:
    checkAppear
    0.4s
    ease-out;
}

@keyframes checkAppear {

  from {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(1.7);
  }

  to {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

}


/* =========================================================
   ONDAS DEL ESCÁNER
   ========================================================= */

.scanner-wave {
  width: 9%;

  animation:
    waveGlow
    1s
    infinite
    ease-in-out;
}

@keyframes waveGlow {

  0%,
  100% {
    opacity: 0.62;
    filter: brightness(0.95);
  }

  50% {
    opacity: 1;
    filter: brightness(1.22);
  }

}


/* Direcciones */

.dir-up {
  transform:
    translate(-50%, -50%)
    rotate(0deg);
}

.dir-right {
  transform:
    translate(-50%, -50%)
    rotate(90deg);
}

.dir-left {
  transform:
    translate(-50%, -50%)
    rotate(-90deg);
}

.dir-down {
  transform:
    translate(-50%, -50%)
    rotate(180deg);
}


/* =========================================================
   OSCURECIMIENTO DURANTE ENCUENTRO
   ========================================================= */

#darkOverlay {
  position: absolute;
  inset: 0;

  z-index: 80;

  background:
    rgba(0,0,0,0.58);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity
    0.25s
    ease;
}

#darkOverlay.show {
  opacity: 1;
  visibility: visible;
}


/* =========================================================
   ENCUENTRO A12
   ========================================================= */

#encounter {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: flex;

  justify-content: center;
  align-items: center;

  padding: 12px;

  opacity: 0;
  visibility: hidden;

  transform:
    scale(0.94);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease;
}

#encounter.show {
  opacity: 1;
  visibility: visible;

  transform:
    scale(1);
}

#encounterCard {
  position: relative;

  width:
    min(
      82vw,
      650px
    );

  max-height: 94vh;
}

#encounterImage {
  display: block;

  width: 100%;
  height: auto;

  max-height: 94vh;

  object-fit: contain;

  pointer-events: none;
}


/* =========================================================
   CORAZÓN DEL MARCIANO
   ========================================================= */

#heartButton {
  position: absolute;

  left: 76%;
  top: 60%;

  width: 21%;
  height: 19%;

  z-index: 120;

  cursor: pointer;

  display: flex;
  justify-content: center;
  align-items: center;
}

#heartCounter {
  position: absolute;

  left: 50%;
  top: 48%;

  transform:
    translate(-50%, -50%);

  width: 44px;
  height: 44px;

  border-radius: 50%;

  display: flex;
  justify-content: center;
  align-items: center;

  background:
    rgba(0,0,0,0.80);

  border:
    3px solid white;

  color: white;

  font-size:
    clamp(
      22px,
      5vw,
      34px
    );

  font-weight: 900;

  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000;

  pointer-events: none;
}

#heartButton.hit {
  animation:
    heartHit
    0.3s
    ease;
}

@keyframes heartHit {

  0% {
    transform:
      scale(1);
  }

  40% {
    transform:
      scale(1.2);
  }

  100% {
    transform:
      scale(1);
  }

}


/* =========================================================
   MENSAJES
   ========================================================= */

#message {
  position: fixed;

  left: 50%;
  top: 44%;

  transform:
    translate(-50%, -50%)
    scale(0.8);

  z-index: 200;

  min-width: 240px;
  max-width: 85vw;

  padding:
    17px
    25px;

  border-radius: 18px;

  background:
    rgba(15,18,22,0.95);

  border:
    3px solid
    #a8d336;

  color: white;

  font-size:
    clamp(
      20px,
      4.6vw,
      36px
    );

  font-weight: 900;

  line-height: 1.15;

  text-align: center;

  opacity: 0;
  visibility: hidden;

  box-shadow:
    0 0 0 3px rgba(0,0,0,0.55),
    0 0 25px rgba(168,211,54,0.45);

  pointer-events: none;
}

#message.show {
  visibility: visible;

  animation:
    messageAnimation
    1.45s
    ease
    forwards;
}

@keyframes messageAnimation {

  0% {
    opacity: 0;

    transform:
      translate(-50%, -20%)
      scale(0.7);
  }

  18% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1.06);
  }

  70% {
    opacity: 1;

    transform:
      translate(-50%, -60%)
      scale(1);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -95%)
      scale(0.95);
  }

}


/* =========================================================
   MÓVIL
   ========================================================= */

@media (max-width: 500px) {

  #musicButton {
    top: 8px;
    right: 8px;

    min-height: 40px;

    padding:
      6px
      10px;

    font-size: 12px;
  }

}


/* =========================================================
   PC
   ========================================================= */

@media (min-width: 900px) {

  #encounterCard {
    width:
      min(
        58vh,
        610px
      );
  }

}

</style>

</head>


<body>


<!-- =========================================================
     MAPA
     ========================================================= -->

<div id="game">

  <div id="map">


    <img
      id="mapImage"
      src="FN1.png"
      alt="Estación espacial MPL"
      draggable="false"
    >


    <!-- MÚSICA -->

    <button
      id="musicButton"
      type="button"
      aria-label="Activar música"
    >
      ♫ MÚSICA
    </button>


    <!-- HABITACIONES -->

    <div
      id="roomA12"
      class="room"
      aria-label="Habitación A12"
    ></div>


    <div
      id="roomB5"
      class="room"
      aria-label="Habitación B5"
    ></div>


    <div
      id="roomB6"
      class="room"
      aria-label="Habitación B6"
    ></div>


    <div
      id="roomB7"
      class="room"
      aria-label="Habitación B7"
    ></div>


    <!-- ESCÁNER -->

    <div
      id="scannerButton"
      aria-label="Escáner"
    ></div>


    <!-- ICONOS -->

    <div id="iconsLayer"></div>


    <!-- OSCURECIMIENTO -->

    <div id="darkOverlay"></div>


  </div>

</div>



<!-- =========================================================
     MÚSICA
     ========================================================= -->

<audio
  id="bgMusic"
  loop
  preload="auto"
>
  <source
    src="Bitácotas Espaciales.mp3"
    type="audio/mpeg"
  >
</audio>



<!-- =========================================================
     ENCUENTRO A12
     ========================================================= -->

<div id="encounter">

  <div id="encounterCard">


    <img
      id="encounterImage"
      src="A12.png"
      alt="Marciano verde"
      draggable="false"
    >


    <div id="heartButton">

      <div id="heartCounter">
        1
      </div>

    </div>


  </div>

</div>


<div id="message"></div>



<script>


/* =========================================================
   ESTADO GENERAL
   ========================================================= */

const state = {

  /*
    Posición inicial:
    fuera de la nave.
  */

  currentRoom:
    "ENTRADA",


  /*
    El escáner tiene su propio estado.

    IMPORTANTE:
    ya NO modifica el estado
    de las habitaciones.
  */

  scannerActive:
    false,


  rooms: {


    A12: {

      status:
        "hidden",

      encounter:
        "icoM1.png",

      label:
        "MARCIANO VERDE"

    },


    B5: {

      status:
        "hidden",

      encounter:
        null,

      label:
        ""

    },


    B6: {

      status:
        "hidden",

      encounter:
        null,

      label:
        ""

    },


    B7: {

      status:
        "hidden",

      encounter:
        null,

      label:
        ""

    }

  }

};



/* =========================================================
   ELEMENTOS
   ========================================================= */

const iconsLayer =
  document.getElementById(
    "iconsLayer"
  );


const scannerButton =
  document.getElementById(
    "scannerButton"
  );


const darkOverlay =
  document.getElementById(
    "darkOverlay"
  );


const encounter =
  document.getElementById(
    "encounter"
  );


const heartButton =
  document.getElementById(
    "heartButton"
  );


const heartCounter =
  document.getElementById(
    "heartCounter"
  );


const message =
  document.getElementById(
    "message"
  );


const bgMusic =
  document.getElementById(
    "bgMusic"
  );


const musicButton =
  document.getElementById(
    "musicButton"
  );



/* =========================================================
   VARIABLES
   ========================================================= */

let enemyLife =
  1;


let defeatingEnemy =
  false;


let messageTimer;


let musicPlaying =
  false;



/* =========================================================
   MÚSICA
   ========================================================= */

bgMusic.volume =
  0.32;


async function toggleMusic() {


  /*
    ENCENDER
  */

  if (
    !musicPlaying
  ) {

    try {

      await bgMusic.play();


      musicPlaying =
        true;


      musicButton.classList.add(
        "music-on"
      );


      musicButton.innerHTML =
        "♫ MÚSICA ON";


      musicButton.setAttribute(
        "aria-label",
        "Desactivar música"
      );

    }

    catch (error) {

      showMessage(
        "NO SE PUDO<br>ACTIVAR LA MÚSICA"
      );

    }


    return;

  }


  /*
    APAGAR
  */

  bgMusic.pause();


  musicPlaying =
    false;


  musicButton.classList.remove(
    "music-on"
  );


  musicButton.innerHTML =
    "♫ MÚSICA";


  musicButton.setAttribute(
    "aria-label",
    "Activar música"
  );

}



musicButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    toggleMusic();

  }
);



/* =========================================================
   MENSAJES
   ========================================================= */

function showMessage(html) {


  clearTimeout(
    messageTimer
  );


  message.classList.remove(
    "show"
  );


  void message.offsetWidth;


  message.innerHTML =
    html;


  message.classList.add(
    "show"
  );


  messageTimer =
    setTimeout(
      () => {

        message.classList.remove(
          "show"
        );

      },

      1450
    );

}



/* =========================================================
   BARAJAR CUARTOS B
   ========================================================= */

function shuffle(array) {


  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {


    const j =
      Math.floor(
        Math.random()
        *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ]
    =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}



function prepareBRooms() {


  const deck =
    shuffle([


      {
        img:
          "icoM1.png",

        label:
          "MARCIANO VERDE"
      },


      {
        img:
          "icoM1.png",

        label:
          "MARCIANO VERDE"
      },


      {
        img:
          "icoM2.png",

        label:
          "MARCIANO MORADO"
      }


    ]);


  const roomNames =
    [
      "B5",
      "B6",
      "B7"
    ];


  roomNames.forEach(
    (roomName, index) => {


      state.rooms[
        roomName
      ].encounter =
        deck[index].img;


      state.rooms[
        roomName
      ].label =
        deck[index].label;


    }
  );

}



prepareBRooms();



/* =========================================================
   SONIDOS
   ========================================================= */

function createAudioContext() {


  const AudioContext =
    window.AudioContext
    ||
    window.webkitAudioContext;


  return new AudioContext();

}



function scannerSound() {


  try {


    const ctx =
      createAudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency
      .setValueAtTime(
        480,
        ctx.currentTime
      );


    oscillator.frequency
      .linearRampToValueAtTime(
        980,
        ctx.currentTime + 0.28
      );


    gain.gain
      .setValueAtTime(
        0.08,
        ctx.currentTime
      );


    gain.gain
      .exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.4
      );


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    oscillator.start();


    oscillator.stop(
      ctx.currentTime + 0.4
    );


  }

  catch (error) {}


}



function deathSound() {


  try {


    const ctx =
      createAudioContext();


    const now =
      ctx.currentTime;


    const frequencies =
      [
        430,
        300,
        180,
        95
      ];


    frequencies.forEach(
      (frequency, index) => {


        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        oscillator.type =
          index < 2
            ?
            "square"
            :
            "sawtooth";


        oscillator.frequency
          .setValueAtTime(
            frequency,
            now + index * 0.09
          );


        gain.gain
          .setValueAtTime(
            0.13,
            now + index * 0.09
          );


        gain.gain
          .exponentialRampToValueAtTime(
            0.001,
            now + 0.22 + index * 0.09
          );


        oscillator.connect(
          gain
        );


        gain.connect(
          ctx.destination
        );


        oscillator.start(
          now + index * 0.09
        );


        oscillator.stop(
          now + 0.25 + index * 0.09
        );


      }
    );


  }

  catch (error) {}


}



/* =========================================================
   CREAR / ELIMINAR ICONOS
   ========================================================= */

function addMapIcon(
  id,
  image,
  room,
  classes
) {


  const previous =
    document.getElementById(
      id
    );


  if (previous) {

    previous.remove();

  }


  const icon =
    document.createElement(
      "img"
    );


  icon.id =
    id;


  icon.src =
    image;


  icon.draggable =
    false;


  icon.className =
    `map-icon pos-${room} ${classes}`;


  iconsLayer.appendChild(
    icon
  );


  return icon;

}



function removeMapIcon(id) {


  const icon =
    document.getElementById(
      id
    );


  if (icon) {

    icon.remove();

  }


}



/* =========================================================
   MARCADOR DE JUGADOR Y CHECKS
   ========================================================= */

function refreshRoomMarkers() {


  /*
    Quitamos el personaje anterior.
  */

  removeMapIcon(
    "player-marker"
  );


  /*
    Quitamos los checks para
    recalcularlos.
  */

  [
    "A12",
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    roomName => {

      removeMapIcon(
        `check-${roomName}`
      );

    }
  );


  /*
    Mostramos al personaje
    en la ubicación actual.
  */

  if (
    state.currentRoom !==
    "ENTRADA"
  ) {


    addMapIcon(

      "player-marker",

      "IcoAstra.png",

      state.currentRoom,

      "player-icon"

    );


  }


  /*
    Las habitaciones ya revisadas
    muestran check únicamente
    si el jugador ya no está allí.
  */

  [
    "A12",
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    roomName => {


      const room =
        state.rooms[
          roomName
        ];


      const reviewed =
        room.status ===
          "completed"
        ||
        room.status ===
          "entered";


      if (
        reviewed
        &&
        state.currentRoom !==
          roomName
      ) {


        addMapIcon(

          `check-${roomName}`,

          "icocheck.png",

          roomName,

          "check-icon"

        );


      }


    }
  );

}



/* =========================================================
   MOVER JUGADOR
   ========================================================= */

function moveToRoom(
  newRoom
) {


  /*
    Quitamos la cara del enemigo
    del cuarto al que entramos.
  */

  removeMapIcon(
    `enemy-${newRoom}`
  );


  /*
    Cambiamos posición.
  */

  state.currentRoom =
    newRoom;


  /*
    Actualizamos personaje y checks.
  */

  refreshRoomMarkers();


}



/* =========================================================
   CONEXIONES DEL MAPA
   ========================================================= */

function getAdjacentRooms(
  currentRoom
) {


  /*
    ENTRADA
    ↓
    A12
  */

  if (
    currentRoom ===
    "ENTRADA"
  ) {


    return [

      {
        room:
          "A12",

        direction:
          "up"
      }

    ];


  }


  /*
    DESDE A12
  */

  if (
    currentRoom ===
    "A12"
  ) {


    return [


      {
        room:
          "B5",

        direction:
          "up"
      },


      {
        room:
          "B6",

        direction:
          "left"
      },


      {
        room:
          "B7",

        direction:
          "right"
      }


    ];


  }


  /*
    Por ahora no hemos
    programado más conexiones.
  */

  return [];


}



/* =========================================================
   APAGAR ESCÁNER

   IMPORTANTE:

   SOLO ELIMINA LAS ONDAS.

   NO CAMBIA EL ESTADO
   DE NINGUNA HABITACIÓN.
   ========================================================= */

function turnOffScanner() {


  state.scannerActive =
    false;


  scannerButton.classList.remove(
    "scanner-on"
  );


  [
    "A12",
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    roomName => {


      removeMapIcon(
        `scan-${roomName}`
      );


    }
  );


}



/* =========================================================
   ENCENDER / APAGAR ESCÁNER
   ========================================================= */

function scanNearbyRooms() {


  /* =====================================================
     SI YA ESTÁ ENCENDIDO:
     APAGAR
     ===================================================== */

  if (
    state.scannerActive
  ) {


    turnOffScanner();


    return;


  }


  /* =====================================================
     HABITACIONES ADYACENTES
     ===================================================== */

  const adjacent =
    getAdjacentRooms(
      state.currentRoom
    );


  if (
    adjacent.length === 0
  ) {


    showMessage(
      "ZONA NO<br>PROGRAMADA"
    );


    return;


  }


  /* =====================================================
     ENCENDER
     ===================================================== */

  state.scannerActive =
    true;


  scannerButton.classList.add(
    "scanner-on"
  );


  scannerSound();


  /* =====================================================
     MOSTRAR ONDAS

     Importante:
     NO modificamos room.status.
     ===================================================== */

  adjacent.forEach(
    ({ room, direction }) => {


      const roomData =
        state.rooms[
          room
        ];


      if (!roomData) {

        return;

      }


      /*
        Solo mostramos ondas
        sobre habitaciones
        cuyo contenido aún
        no conocemos.
      */

      if (
        roomData.status ===
        "hidden"
      ) {


        addMapIcon(

          `scan-${room}`,

          "Esc1.png",

          room,

          `scanner-wave dir-${direction}`

        );


      }


    }
  );


}



scannerButton.addEventListener(
  "click",
  scanNearbyRooms
);



/* =========================================================
   ABRIR ENCUENTRO A12
   ========================================================= */

function openA12Encounter() {


  /*
    Al entrar, apagamos el escáner
    pero NO alteramos la habitación.
  */

  turnOffScanner();


  enemyLife =
    1;


  defeatingEnemy =
    false;


  heartCounter.textContent =
    enemyLife;


  encounter.classList.add(
    "show"
  );


  darkOverlay.classList.add(
    "show"
  );


}



/* =========================================================
   COMPLETAR A12
   ========================================================= */

function completeA12() {


  encounter.classList.remove(
    "show"
  );


  darkOverlay.classList.remove(
    "show"
  );


  /*
    A12 queda revisada.
  */

  state.rooms.A12.status =
    "completed";


  removeMapIcon(
    "scan-A12"
  );


  removeMapIcon(
    "enemy-A12"
  );


  /*
    El personaje entra físicamente
    en A12.
  */

  moveToRoom(
    "A12"
  );


}



/* =========================================================
   ¿ESTÁ ESTA SALA CONECTADA
   A LA POSICIÓN ACTUAL?
   ========================================================= */

function roomIsAdjacent(
  roomName
) {


  const adjacent =
    getAdjacentRooms(
      state.currentRoom
    );


  return adjacent.some(
    connection =>
      connection.room ===
      roomName
  );


}



/* =========================================================
   TOCAR HABITACIÓN
   ========================================================= */

function handleRoomClick(
  roomName
) {


  const room =
    state.rooms[
      roomName
    ];


  if (!room) {

    return;

  }


  /* =====================================================
     SI ES EL CUARTO DONDE YA ESTAMOS
     ===================================================== */

  if (
    state.currentRoom ===
    roomName
  ) {


    showMessage(
      "ESTÁS EN<br>ESTA SALA"
    );


    return;


  }


  /* =====================================================
     COMPROBAR CONEXIÓN
     ===================================================== */

  const accessible =
    roomIsAdjacent(
      roomName
    );


  if (!accessible) {

    return;

  }


  /* =====================================================
     CASO 1

     HABITACIÓN NO REVELADA
     +
     ESCÁNER ENCENDIDO

     TOCAR = REVELAR
     ===================================================== */

  if (
    room.status ===
      "hidden"
    &&
    state.scannerActive
  ) {


    /*
      El contenido queda descubierto.
    */

    room.status =
      "revealed";


    /*
      Quitamos únicamente la onda
      de esta habitación.
    */

    removeMapIcon(
      `scan-${roomName}`
    );


    /*
      Mostramos el contenido.
    */

    addMapIcon(

      `enemy-${roomName}`,

      room.encounter,

      roomName,

      "enemy-icon"

    );


    /*
      Coste del escaneo.
    */

    showMessage(

      `${room.label}<br>−2 ENERGÍAS`

    );


    return;


  }


  /* =====================================================
     CASO 2

     HABITACIÓN NO REVELADA
     +
     ESCÁNER APAGADO

     TOCAR = ENTRAR A CIEGAS
     ===================================================== */

  if (
    room.status ===
      "hidden"
    &&
    !state.scannerActive
  ) {


    /*
      A12 tiene combate.
    */

    if (
      roomName ===
      "A12"
    ) {


      openA12Encounter();


      return;


    }


    /*
      CUARTOS B

      Por ahora simplemente
      entramos.
    */

    room.status =
      "entered";


    moveToRoom(
      roomName
    );


    showMessage(

      `ENTRASTE A<br>${roomName}`

    );


    return;


  }


  /* =====================================================
     CASO 3

     HABITACIÓN YA REVELADA

     TOCAR = ENTRAR
     ===================================================== */

  if (
    room.status ===
    "revealed"
  ) {


    /*
      Apagamos escáner si estaba activo.
    */

    turnOffScanner();


    /*
      A12
    */

    if (
      roomName ===
      "A12"
    ) {


      openA12Encounter();


      return;


    }


    /*
      B
    */

    room.status =
      "entered";


    moveToRoom(
      roomName
    );


    showMessage(

      `ENTRASTE A<br>${roomName}`

    );


    return;


  }


  /* =====================================================
     CASO 4

     HABITACIÓN YA REVISADA

     PERMITIR MOVIMIENTO
     ===================================================== */

  if (
    room.status ===
      "completed"
    ||
    room.status ===
      "entered"
  ) {


    turnOffScanner();


    moveToRoom(
      roomName
    );


    return;


  }


}



/* =========================================================
   EVENTOS DE LAS HABITACIONES
   ========================================================= */

document
  .getElementById(
    "roomA12"
  )
  .addEventListener(
    "click",
    () =>
      handleRoomClick(
        "A12"
      )
  );


document
  .getElementById(
    "roomB5"
  )
  .addEventListener(
    "click",
    () =>
      handleRoomClick(
        "B5"
      )
  );


document
  .getElementById(
    "roomB6"
  )
  .addEventListener(
    "click",
    () =>
      handleRoomClick(
        "B6"
      )
  );


document
  .getElementById(
    "roomB7"
  )
  .addEventListener(
    "click",
    () =>
      handleRoomClick(
        "B7"
      )
  );



/* =========================================================
   ATAQUE AL MARCIANO A12
   ========================================================= */

heartButton.addEventListener(
  "click",
  () => {


    if (
      defeatingEnemy
      ||
      enemyLife <= 0
    ) {


      return;


    }


    enemyLife--;


    heartCounter.textContent =
      enemyLife;


    heartButton.classList.remove(
      "hit"
    );


    void heartButton.offsetWidth;


    heartButton.classList.add(
      "hit"
    );


    /* =====================================================
       MARCIANO DERROTADO
       ===================================================== */

    if (
      enemyLife === 0
    ) {


      defeatingEnemy =
        true;


      deathSound();


      setTimeout(
        () => {


          completeA12();


        },

        650
      );


    }


  }
);



/* =========================================================
   EVITAR DOBLE ZOOM MÓVIL
   ========================================================= */

let lastTouchEnd =
  0;


document.addEventListener(

  "touchend",

  function(event) {


    const now =
      Date.now();


    if (
      now
      -
      lastTouchEnd
      <=
      300
    ) {


      event.preventDefault();


    }


    lastTouchEnd =
      now;


  },

  {
    passive:
      false
  }

);


</script>
