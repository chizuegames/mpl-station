<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>MPL - Estación Espacial</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #050713;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ==========================================
       CONTENEDOR GENERAL
       ========================================== */

    #game {
      position: relative;
      width: 100%;
      max-width: 1066px;
      margin: 0 auto;
      overflow: hidden;
      background: #050713;
      user-select: none;
      -webkit-user-select: none;
    }

    #map {
      position: relative;
      width: 100%;
    }

    #mapImage {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    /* ==========================================
       ZONAS DE HABITACIONES
       ========================================== */

    .room {
      position: absolute;
      z-index: 10;
      cursor: pointer;
    }

    /*
      Estas zonas son invisibles.
      Están ubicadas sobre los cuartos correspondientes.
    */

    #roomA12 {
      left: 42.6%;
      top: 62.0%;
      width: 14.8%;
      height: 7.8%;
    }

    #roomB5 {
      left: 42.6%;
      top: 54.3%;
      width: 14.8%;
      height: 7.8%;
    }

    #roomB6 {
      left: 27.8%;
      top: 62.0%;
      width: 14.8%;
      height: 7.8%;
    }

    #roomB7 {
      left: 57.4%;
      top: 62.0%;
      width: 14.8%;
      height: 7.8%;
    }

    /* ==========================================
       BOTÓN DEL ESCÁNER
       ========================================== */

    #scannerButton {
      position: absolute;
      left: 38%;
      top: 89.5%;
      width: 24%;
      height: 9%;
      z-index: 20;
      cursor: pointer;
    }

    #scannerButton.enabled {
      animation: scannerPulse 1.7s infinite ease-in-out;
    }

    @keyframes scannerPulse {
      0%,
      100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.25);
      }
    }

    /* ==========================================
       ICONOS SOBRE EL MAPA
       ========================================== */

    .map-icon {
      position: absolute;
      z-index: 30;
      pointer-events: none;
      transform: translate(-50%, -50%);
      object-fit: contain;
    }

    .check-icon {
      width: 11%;
    }

    .scanner-icon {
      width: 10%;
      animation: scannerWave 1s infinite ease-in-out;
    }

    .enemy-icon {
      width: 10%;
      animation: revealEnemy 0.35s ease-out;
    }

    @keyframes scannerWave {
      0%,
      100% {
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.65;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 1;
      }
    }

    @keyframes revealEnemy {
      from {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    /* CENTROS DE LOS CUARTOS */

    .pos-A12 {
      left: 50%;
      top: 65.9%;
    }

    .pos-B5 {
      left: 50%;
      top: 58.2%;
    }

    .pos-B6 {
      left: 35.2%;
      top: 65.9%;
    }

    .pos-B7 {
      left: 64.8%;
      top: 65.9%;
    }

    /* ==========================================
       OSCURECER MAPA DURANTE ENCUENTRO
       ========================================== */

    #darkOverlay {
      position: absolute;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.58);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
    }

    #darkOverlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* ==========================================
       ENCUENTRO A12
       ========================================== */

    #encounter {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;

      transform: scale(0.94);
    }

    #encounter.show {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    #encounterCard {
      position: relative;
      width: min(82vw, 650px);
      max-height: 94vh;
    }

    #encounterImage {
      display: block;
      width: 100%;
      height: auto;
      max-height: 94vh;
      object-fit: contain;
      pointer-events: none;
    }

    /* ==========================================
       CORAZÓN DEL MARCIANO
       ========================================== */

    #heartButton {
      position: absolute;

      left: 76%;
      top: 60%;

      width: 21%;
      height: 19%;

      cursor: pointer;
      z-index: 120;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #heartCounter {
      position: absolute;

      left: 50%;
      top: 48%;

      transform: translate(-50%, -50%);

      width: 44px;
      height: 44px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.78);

      border: 3px solid white;

      color: white;

      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;

      text-shadow:
        2px 2px 0 #000,
        -2px -2px 0 #000;

      pointer-events: none;
    }

    #heartButton.hit {
      animation: heartHit 0.32s ease;
    }

    @keyframes heartHit {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.22);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ==========================================
       AVISOS
       ========================================== */

    #message {
      position: fixed;

      left: 50%;
      top: 45%;

      transform: translate(-50%, -50%) scale(0.8);

      z-index: 200;

      min-width: 220px;

      padding: 16px 25px;

      border-radius: 18px;

      background: rgba(15, 18, 22, 0.94);

      border: 3px solid #a8d336;

      color: white;

      font-size: clamp(22px, 5vw, 42px);
      font-weight: 900;

      text-align: center;

      opacity: 0;
      visibility: hidden;

      box-shadow:
        0 0 0 3px rgba(0, 0, 0, 0.55),
        0 0 25px rgba(168, 211, 54, 0.45);

      pointer-events: none;
    }

    #message.show {
      visibility: visible;
      animation: messageAnimation 1.2s ease forwards;
    }

    @keyframes messageAnimation {
      0% {
        opacity: 0;
        transform: translate(-50%, -20%) scale(0.7);
      }

      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
      }

      70% {
        opacity: 1;
        transform: translate(-50%, -60%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -95%) scale(0.95);
      }
    }

    /* ==========================================
       PEQUEÑA ANIMACIÓN AL COMPLETAR A12
       ========================================== */

    .check-enter {
      animation: checkEnter 0.5s ease-out;
    }

    @keyframes checkEnter {
      from {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    /* ==========================================
       PC
       ========================================== */

    @media (min-width: 900px) {
      #game {
        width: min(100vw, 760px);
      }

      #encounterCard {
        width: min(58vh, 610px);
      }
    }
  </style>
</head>

<body>

  <div id="game">

    <div id="map">

      <!-- FONDO -->
      <img
        id="mapImage"
        src="FN1.png"
        alt="Estación espacial MPL"
        draggable="false"
      />

      <!-- HABITACIONES -->

      <div
        id="roomA12"
        class="room"
        data-room="A12"
        aria-label="Habitación A12"
      ></div>

      <div
        id="roomB5"
        class="room"
        data-room="B5"
        aria-label="Habitación B5"
      ></div>

      <div
        id="roomB6"
        class="room"
        data-room="B6"
        aria-label="Habitación B6"
      ></div>

      <div
        id="roomB7"
        class="room"
        data-room="B7"
        aria-label="Habitación B7"
      ></div>

      <!-- BOTÓN ESCÁNER -->

      <div
        id="scannerButton"
        aria-label="Escáner"
      ></div>

      <!-- CAPA PARA ICONOS -->

      <div id="iconsLayer"></div>

      <!-- OSCURECIMIENTO -->

      <div id="darkOverlay"></div>

    </div>

  </div>

  <!-- ======================================
       ENCUENTRO A12
       ====================================== -->

  <div id="encounter">

    <div id="encounterCard">

      <img
        id="encounterImage"
        src="A12.png"
        alt="Encuentro A12"
        draggable="false"
      />

      <div id="heartButton">

        <div id="heartCounter">
          1
        </div>

      </div>

    </div>

  </div>

  <!-- AVISO -->

  <div id="message"></div>

  <script>

    /* ==========================================
       ESTADO GENERAL DEL JUEGO
       ========================================== */

    const gameState = {

      currentRoom: "ENTRADA",

      a12Completed: false,

      scannerUnlocked: false,

      scannerActive: false,

      rooms: {

        B5: {
          status: "hidden",
          encounter: null
        },

        B6: {
          status: "hidden",
          encounter: null
        },

        B7: {
          status: "hidden",
          encounter: null
        }

      }

    };


    /* ==========================================
       ELEMENTOS
       ========================================== */

    const roomA12 =
      document.getElementById("roomA12");

    const scannerButton =
      document.getElementById("scannerButton");

    const encounter =
      document.getElementById("encounter");

    const darkOverlay =
      document.getElementById("darkOverlay");

    const heartButton =
      document.getElementById("heartButton");

    const heartCounter =
      document.getElementById("heartCounter");

    const iconsLayer =
      document.getElementById("iconsLayer");

    const message =
      document.getElementById("message");


    /* ==========================================
       BARAJAR HABITACIONES B
       ========================================== */

    /*
      Por ahora tenemos:

      2 marcianos verdes
      1 marciano morado

      Se mezclan entre B5, B6 y B7.

      Más adelante aquí pondremos el mazo
      completo de encuentros B.
    */

    function shuffle(array) {

      const result = [...array];

      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          result[i],
          result[j]
        ] =
        [
          result[j],
          result[i]
        ];

      }

      return result;

    }


    function prepareBRooms() {

      const encounters =
        shuffle([
          "icoM1.png",
          "icoM1.png",
          "icoM2.png"
        ]);

      gameState.rooms.B5.encounter =
        encounters[0];

      gameState.rooms.B6.encounter =
        encounters[1];

      gameState.rooms.B7.encounter =
        encounters[2];

    }


    prepareBRooms();


    /* ==========================================
       SONIDOS GENERADOS POR EL NAVEGADOR
       ========================================== */

    function createAudioContext() {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      return new AudioContext();

    }


    function deathSound() {

      try {

        const ctx =
          createAudioContext();

        const now =
          ctx.currentTime;

        const frequencies =
          [430, 300, 180, 95];

        frequencies.forEach(
          (frequency, index) => {

            const oscillator =
              ctx.createOscillator();

            const gain =
              ctx.createGain();

            oscillator.type =
              index < 2
                ? "square"
                : "sawtooth";

            oscillator.frequency.setValueAtTime(
              frequency,
              now + index * 0.09
            );

            gain.gain.setValueAtTime(
              0.13,
              now + index * 0.09
            );

            gain.gain.exponentialRampToValueAtTime(
              0.001,
              now + 0.22 + index * 0.09
            );

            oscillator.connect(gain);
            gain.connect(ctx.destination);

            oscillator.start(
              now + index * 0.09
            );

            oscillator.stop(
              now + 0.25 + index * 0.09
            );

          }
        );

      } catch (error) {

        console.log(
          "El navegador bloqueó el sonido."
        );

      }

    }


    function scannerSound() {

      try {

        const ctx =
          createAudioContext();

        const oscillator =
          ctx.createOscillator();

        const gain =
          ctx.createGain();

        oscillator.type =
          "sine";

        oscillator.frequency
          .setValueAtTime(
            500,
            ctx.currentTime
          );

        oscillator.frequency
          .linearRampToValueAtTime(
            950,
            ctx.currentTime + 0.25
          );

        gain.gain
          .setValueAtTime(
            0.08,
            ctx.currentTime
          );

        gain.gain
          .exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.35
          );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
          ctx.currentTime + 0.35
        );

      } catch (error) {}

    }


    /* ==========================================
       MENSAJES
       ========================================== */

    let messageTimer;


    function showMessage(text) {

      clearTimeout(messageTimer);

      message.classList.remove("show");

      void message.offsetWidth;

      message.textContent =
        text;

      message.classList.add("show");

      messageTimer =
        setTimeout(() => {

          message.classList.remove("show");

        }, 1200);

    }


    /* ==========================================
       ABRIR A12
       ========================================== */

    roomA12.addEventListener(
      "click",
      () => {

        if (
          gameState.a12Completed
        ) {
          return;
        }

        heartCounter.textContent =
          "1";

        encounter.classList.add(
          "show"
        );

        darkOverlay.classList.add(
          "show"
        );

      }
    );


    /* ==========================================
       ATACAR MARCIANO A12
       ========================================== */

    let enemyLife = 1;

    let defeatingEnemy = false;


    heartButton.addEventListener(
      "click",
      () => {

        if (
          defeatingEnemy ||
          enemyLife <= 0
        ) {
          return;
        }

        enemyLife--;

        heartCounter.textContent =
          enemyLife;

        heartButton.classList.remove(
          "hit"
        );

        void heartButton.offsetWidth;

        heartButton.classList.add(
          "hit"
        );

        if (
          enemyLife === 0
        ) {

          defeatingEnemy = true;

          deathSound();

          setTimeout(() => {

            completeA12();

          }, 650);

        }

      }
    );


    /* ==========================================
       COMPLETAR A12
       ========================================== */

    function completeA12() {

      encounter.classList.remove(
        "show"
      );

      darkOverlay.classList.remove(
        "show"
      );

      gameState.a12Completed =
        true;

      gameState.currentRoom =
        "A12";

      gameState.scannerUnlocked =
        true;

      scannerButton.classList.add(
        "enabled"
      );

      addMapIcon(
        "check-A12",
        "icocheck.png",
        "A12",
        "check-icon check-enter"
      );

      defeatingEnemy =
        false;

    }


    /* ==========================================
       AÑADIR ICONOS AL MAPA
       ========================================== */

    function addMapIcon(
      id,
      image,
      room,
      classes
    ) {

      const oldIcon =
        document.getElementById(id);

      if (oldIcon) {
        oldIcon.remove();
      }

      const icon =
        document.createElement("img");

      icon.id =
        id;

      icon.src =
        image;

      icon.draggable =
        false;

      icon.className =
        `map-icon pos-${room} ${classes}`;

      iconsLayer.appendChild(
        icon
      );

      return icon;

    }


    /* ==========================================
       ELIMINAR ICONO
       ========================================== */

    function removeMapIcon(id) {

      const icon =
        document.getElementById(id);

      if (icon) {
        icon.remove();
      }

    }


    /* ==========================================
       USAR ESCÁNER
       ========================================== */

    scannerButton.addEventListener(
      "click",
      () => {

        if (
          !gameState.scannerUnlocked
        ) {
          return;
        }

        /*
          En esta primera versión
          solo conocemos las conexiones
          desde A12.
        */

        if (
          gameState.currentRoom !== "A12"
        ) {

          showMessage(
            "ZONA NO PROGRAMADA"
          );

          return;

        }

        scannerSound();

        gameState.scannerActive =
          true;

        [
          "B5",
          "B6",
          "B7"
        ].forEach(room => {

          const data =
            gameState.rooms[room];

          if (
            data.status === "hidden"
          ) {

            data.status =
              "scannable";

            addMapIcon(
              `scan-${room}`,
              "Esc1.png",
              room,
              "scanner-icon"
            );

          }

        });

      }
    );


    /* ==========================================
       HABITACIONES B
       ========================================== */

    [
      "B5",
      "B6",
      "B7"
    ].forEach(roomName => {

      const element =
        document.getElementById(
          `room${roomName}`
        );

      element.addEventListener(
        "click",
        () => {

          handleBRoom(
            roomName
          );

        }
      );

    });


    function handleBRoom(roomName) {

      const room =
        gameState.rooms[
          roomName
        ];

      /*
        Todavía no ha sido
        marcada por el escáner.
      */

      if (
        room.status === "hidden"
      ) {
        return;
      }


      /*
        PRIMER TOQUE:
        revelar qué hay dentro.
      */

      if (
        room.status === "scannable"
      ) {

        room.status =
          "revealed";

        removeMapIcon(
          `scan-${roomName}`
        );

        addMapIcon(
          `enemy-${roomName}`,
          room.encounter,
          roomName,
          "enemy-icon"
        );

        showMessage(
          "−2 ENERGÍAS"
        );

        return;

      }


      /*
        SEGUNDO TOQUE:
        entrar al cuarto.
      */

      if (
        room.status === "revealed"
      ) {

        room.status =
          "entered";

        gameState.currentRoom =
          roomName;

        clearScannerWaves();

        scannerButton
          .classList
          .remove("enabled");

        showMessage(
          `ENTRASTE A ${roomName}`
        );

        return;

      }

    }


    /* ==========================================
       QUITAR ONDAS CUANDO NOS MOVEMOS
       ========================================== */

    function clearScannerWaves() {

      [
        "B5",
        "B6",
        "B7"
      ].forEach(room => {

        removeMapIcon(
          `scan-${room}`
        );

        if (
          gameState.rooms[room]
            .status === "scannable"
        ) {

          gameState.rooms[room]
            .status = "hidden";

        }

      });

      gameState.scannerActive =
        false;

    }


    /* ==========================================
       EVITAR DOBLE ZOOM EN ALGUNOS MÓVILES
       ========================================== */

    let lastTouchEnd = 0;

    document.addEventListener(
      "touchend",
      function(event) {

        const now =
          Date.now();

        if (
          now - lastTouchEnd <= 300
        ) {

          event.preventDefault();

        }

        lastTouchEnd =
          now;

      },
      {
        passive: false
      }
    );

  </script>

</body>
</html>
