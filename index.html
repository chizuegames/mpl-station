<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MPL - Estación Espacial</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#050713;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  touch-action:manipulation;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

img{
  user-select:none;
  -webkit-user-drag:none;
}


/* =========================================================
   INTRO
   ========================================================= */

#introOverlay{
  position:relative;
  width:min(100vw,760px);
  margin:0 auto;
  background:#050713;
  overflow:hidden;
}

.intro-page{
  display:none;
  position:relative;
  width:100%;
  animation:introFade .28s ease;
}

.intro-page.active{
  display:block;
}

.intro-image,
.dock-base{
  display:block;
  width:100%;
  height:auto;
}

#introPage1{
  cursor:pointer;
}


/* =========================================================
   BOTÓN ACEPTAR
   ========================================================= */

#acceptMissionButton{
  position:absolute;

  left:50%;
  bottom:4.5%;

  transform:translateX(-50%);

  z-index:10;

  min-width:180px;

  padding:14px 28px;

  border:3px solid #ffc164;
  border-radius:18px;

  background:rgba(190,92,0,.93);

  color:#fff;

  font-size:clamp(19px,4vw,28px);

  font-weight:900;

  letter-spacing:.8px;

  cursor:pointer;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.45),
    0 0 22px rgba(255,142,22,.65);
}

#acceptMissionButton:active{
  transform:
    translateX(-50%)
    scale(.96);
}


/* =========================================================
   SECUENCIA DE ACOPLE
   ========================================================= */

#dockScene{
  position:relative;

  width:100%;

  overflow:hidden;

  background:#050713;
}

#dockShip{
  position:absolute;

  left:50%;
  top:111%;

  width:25%;
  height:auto;

  transform:
    translate(-50%,-50%);

  filter:
    drop-shadow(
      0 0 14px
      rgba(255,139,30,.6)
    );

  z-index:5;

  opacity:1;
}

#dockShip.docking{
  animation:
    dockMove
    2.25s
    cubic-bezier(.25,.75,.25,1)
    forwards;
}

#dockFlash{
  position:absolute;

  inset:0;

  z-index:8;

  background:#fff;

  opacity:0;

  pointer-events:none;
}

#dockFlash.flash{
  animation:
    dockFlash
    .28s
    ease;
}


@keyframes introFade{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


@keyframes dockMove{

  0%{
    top:112%;

    transform:
      translate(-50%,-50%)
      scale(.92);
  }

  22%{
    top:99%;

    transform:
      translate(-50%,-50%)
      scale(.95);
  }

  70%{
    top:81%;

    transform:
      translate(-50%,-50%)
      scale(.99);
  }

  100%{
    top:74.6%;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

}


@keyframes dockFlash{

  0%{
    opacity:0;
  }

  45%{
    opacity:.35;
  }

  100%{
    opacity:0;
  }

}


/* =========================================================
   JUEGO
   ========================================================= */

#game{
  display:none;

  position:relative;

  width:min(100vw,760px);

  margin:0 auto;

  overflow:hidden;

  background:#050713;

  user-select:none;
  -webkit-user-select:none;
}

#map{
  position:relative;

  width:100%;
}

#mapImage{
  display:block;

  width:100%;
  height:auto;

  pointer-events:none;
}


/* =========================================================
   HABITACIONES

   BAJADAS PARA ADAPTARSE A MIc.png
   ========================================================= */

.room{
  position:absolute;

  z-index:20;

  cursor:pointer;
}


/* A12 */

#roomA12{
  left:43%;
  top:63.6%;

  width:15.2%;
  height:7.6%;
}


/* B5 */

#roomB5{
  left:43%;
  top:53.9%;

  width:15.2%;
  height:7.6%;
}


/* B6 */

#roomB6{
  left:26%;
  top:63.6%;

  width:14.8%;
  height:7.6%;
}


/* B7 */

#roomB7{
  left:60.2%;
  top:63.6%;

  width:14.8%;
  height:7.6%;
}


/* =========================================================
   ESCÁNER
   ========================================================= */

#scannerButton{
  position:absolute;

  left:38%;
  top:89.3%;

  width:24%;
  height:8.9%;

  z-index:25;

  cursor:pointer;

  animation:
    scannerPulse
    1.8s
    infinite
    ease-in-out;
}

#scannerButton.scanner-on{
  animation:
    scannerOn
    .9s
    infinite
    ease-in-out;
}


@keyframes scannerPulse{

  0%,
  100%{
    filter:brightness(1);
  }

  50%{
    filter:brightness(1.2);
  }

}


@keyframes scannerOn{

  0%,
  100%{
    filter:
      brightness(1.15)
      drop-shadow(
        0 0 5px
        #a8d336
      );
  }

  50%{
    filter:
      brightness(1.4)
      drop-shadow(
        0 0 15px
        #a8d336
      );
  }

}


/* =========================================================
   MÚSICA
   ========================================================= */

#musicButton{
  position:absolute;

  top:12px;
  right:12px;

  z-index:70;

  min-height:44px;

  padding:8px 14px;

  border:
    2px solid
    #a8d336;

  border-radius:24px;

  background:
    rgba(10,15,20,.88);

  color:#fff;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 0 0 2px rgba(0,0,0,.45),
    0 0 12px rgba(168,211,54,.25);
}

#musicButton:active{
  transform:scale(.94);
}

#musicButton.music-on{
  background:
    rgba(130,170,30,.92);

  box-shadow:
    0 0 0 2px rgba(0,0,0,.45),
    0 0 18px rgba(168,211,54,.7);
}


/* =========================================================
   ICONOS DEL MAPA
   ========================================================= */

#iconsLayer{
  position:absolute;

  inset:0;

  z-index:30;

  pointer-events:none;
}

.map-icon{
  position:absolute;

  pointer-events:none;

  object-fit:contain;
}


/* =========================================================
   CENTROS DE LAS HABITACIONES

   TODOS BAJADOS PARA MIc.png
   ========================================================= */

.pos-A12{
  left:50.6%;
  top:67.4%;
}

.pos-B5{
  left:50.5%;
  top:57.7%;
}

.pos-B6{
  left:33.4%;
  top:67.4%;
}

.pos-B7{
  left:67.7%;
  top:67.4%;
}


/* =========================================================
   ASTRA
   ========================================================= */

.player-icon{
  width:13%;

  transform:
    translate(-50%,-50%);

  animation:
    pop
    .35s
    ease-out;

  filter:
    drop-shadow(
      0 0 8px
      rgba(255,255,255,.35)
    );
}


/* =========================================================
   ICONOS DE EVENTOS
   ========================================================= */

.event-icon{
  width:12.5%;

  transform:
    translate(-50%,-50%);

  animation:
    pop
    .35s
    ease-out;
}


/* =========================================================
   CHECK
   ========================================================= */

.check-icon{
  width:11.5%;

  transform:
    translate(-50%,-50%);

  animation:
    pop
    .35s
    ease-out;
}


/* =========================================================
   ONDAS
   ========================================================= */

.scanner-wave{
  width:9%;

  animation:
    waveGlow
    1s
    infinite
    ease-in-out;
}


@keyframes pop{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.25);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

}


@keyframes waveGlow{

  0%,
  100%{
    opacity:.62;

    filter:
      brightness(.95);
  }

  50%{
    opacity:1;

    filter:
      brightness(1.22);
  }

}


.dir-up{
  transform:
    translate(-50%,-50%)
    rotate(0);
}

.dir-right{
  transform:
    translate(-50%,-50%)
    rotate(90deg);
}

.dir-left{
  transform:
    translate(-50%,-50%)
    rotate(-90deg);
}

.dir-down{
  transform:
    translate(-50%,-50%)
    rotate(180deg);
}


/* =========================================================
   PANTALLA DE ENCUENTRO
   ========================================================= */

#encounter{
  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:12px;

  background:
    rgba(0,0,0,.62);

  opacity:0;

  visibility:hidden;

  transform:
    scale(.96);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

#encounter.show{
  opacity:1;

  visibility:visible;

  transform:
    scale(1);
}

#encounterCard{
  position:relative;

  width:
    min(
      82vw,
      650px
    );

  max-height:94vh;

  cursor:default;
}

#encounterImage{
  display:block;

  width:100%;
  height:auto;

  max-height:94vh;

  object-fit:contain;

  pointer-events:none;
}


/* =========================================================
   ZONAS DE ATAQUE
   ========================================================= */

.attack-zone{
  position:absolute;

  z-index:120;

  border:0;

  background:transparent;

  cursor:pointer;

  display:none;
}


/* PISTOLA */

#gunButton{
  left:6%;
  top:51%;

  width:35%;
  height:27%;
}


/* PUÑO */

#fistButton{
  left:62%;
  top:51%;

  width:35%;
  height:27%;
}


/* =========================================================
   VIDA DEL ENEMIGO
   ========================================================= */

#enemyHp{
  position:absolute;

  z-index:125;

  left:82%;
  top:12.5%;

  transform:
    translate(-50%,-50%);

  display:none;

  min-width:44px;
  height:44px;

  padding:
    0
    10px;

  border-radius:24px;

  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.82);

  border:
    3px solid
    #fff;

  color:#fff;

  font-size:
    clamp(
      22px,
      5vw,
      34px
    );

  font-weight:900;

  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000;

  pointer-events:none;
}


#encounterCard.combat #gunButton,
#encounterCard.combat #fistButton,
#encounterCard.combat #enemyHp{
  display:flex;
}


/* =========================================================
   GOLPE
   ========================================================= */

#encounterCard.hit{
  animation:
    cardHit
    .22s
    ease;
}


@keyframes cardHit{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(.985);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   MENSAJES
   ========================================================= */

#message{
  position:fixed;

  left:50%;
  top:44%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  z-index:200;

  min-width:240px;
  max-width:85vw;

  padding:
    17px
    25px;

  border-radius:18px;

  background:
    rgba(15,18,22,.95);

  border:
    3px solid
    #a8d336;

  color:#fff;

  font-size:
    clamp(
      20px,
      4.6vw,
      36px
    );

  font-weight:900;

  line-height:1.15;

  text-align:center;

  opacity:0;

  visibility:hidden;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.55),
    0 0 25px rgba(168,211,54,.45);

  pointer-events:none;
}

#message.show{
  visibility:visible;

  animation:
    messageAnimation
    1.35s
    ease
    forwards;
}


@keyframes messageAnimation{

  0%{
    opacity:0;

    transform:
      translate(-50%,-20%)
      scale(.7);
  }

  18%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.06);
  }

  72%{
    opacity:1;

    transform:
      translate(-50%,-60%)
      scale(1);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-95%)
      scale(.95);
  }

}


/* =========================================================
   MÓVIL
   ========================================================= */

@media(max-width:500px){

  #musicButton{
    top:8px;
    right:8px;

    min-height:40px;

    padding:
      6px
      10px;

    font-size:12px;
  }


  #acceptMissionButton{
    min-width:145px;

    padding:
      11px
      20px;
  }

}


/* =========================================================
   PC
   ========================================================= */

@media(min-width:900px){

  #encounterCard{
    width:
      min(
        58vh,
        610px
      );
  }

}

</style>
</head>

/* =========================================================
   AUDIO CONTEXT GENERAL
   ========================================================= */

function getAudioContext() {


  if (
    !gameAudioContext
  ) {


    const AudioContext =
      window.AudioContext
      ||
      window.webkitAudioContext;


    gameAudioContext =
      new AudioContext();


  }


  if (
    gameAudioContext.state ===
    "suspended"
  ) {


    gameAudioContext.resume();


  }


  return gameAudioContext;


}

/* =========================================================
   TRANSICIÓN DE MÚSICA
   ========================================================= */

function crossfadeToGameMusic() {


  /*
    Bitácotas empieza muy bajo.
  */

  bgMusic.volume =
    .03;


  /*
    Como esta función es llamada
    directamente por ACEPTAR,
    el navegador permite play().
  */

  bgMusic.play()
    .then(
      () => {


        musicPlaying =
          true;


        musicButton.classList.add(
          "music-on"
        );


        musicButton.textContent =
          "♫ MÚSICA ON";


      }
    )
    .catch(
      () => {}
    );


  const steps =
    18;


  let currentStep =
    0;


  const introStart =
    introMusic.volume;


  const gameTarget =
    .32;


  const timer =
    setInterval(
      () => {


        currentStep++;


        const progress =
          currentStep
          /
          steps;


        introMusic.volume =
          Math.max(
            0,
            introStart
            *
            (1 - progress)
          );


        bgMusic.volume =
          .03
          +
          (
            gameTarget - .03
          )
          *
          progress;


        if (
          currentStep >=
          steps
        ) {


          clearInterval(
            timer
          );


          introMusic.pause();


          introMusic.currentTime =
            0;


          introMusic.volume =
            .34;


          bgMusic.volume =
            .32;


        }


      },

      65
    );


}

/* =========================================================
   SONIDO DE NAVE EN MOVIMIENTO
   ========================================================= */

function dockingTravelSound() {


  try {


    const ctx =
      getAudioContext();


    const master =
      ctx.createGain();


    const low =
      ctx.createOscillator();


    const high =
      ctx.createOscillator();


    const filter =
      ctx.createBiquadFilter();


    low.type =
      "sawtooth";


    high.type =
      "triangle";


    low.frequency
      .setValueAtTime(
        58,
        ctx.currentTime
      );


    low.frequency
      .linearRampToValueAtTime(
        98,
        ctx.currentTime
        +
        2.25
      );


    high.frequency
      .setValueAtTime(
        118,
        ctx.currentTime
      );


    high.frequency
      .linearRampToValueAtTime(
        185,
        ctx.currentTime
        +
        2.25
      );


    filter.type =
      "lowpass";


    filter.frequency
      .setValueAtTime(
        520,
        ctx.currentTime
      );


    filter.frequency
      .linearRampToValueAtTime(
        900,
        ctx.currentTime
        +
        2.1
      );


    master.gain
      .setValueAtTime(
        .001,
        ctx.currentTime
      );


    master.gain
      .linearRampToValueAtTime(
        .11,
        ctx.currentTime
        +
        .25
      );


    master.gain
      .setValueAtTime(
        .11,
        ctx.currentTime
        +
        1.65
      );


    master.gain
      .exponentialRampToValueAtTime(
        .001,
        ctx.currentTime
        +
        2.35
      );


    low.connect(
      filter
    );


    high.connect(
      filter
    );


    filter.connect(
      master
    );


    master.connect(
      ctx.destination
    );


    low.start();


    high.start();


    low.stop(
      ctx.currentTime
      +
      2.4
    );


    high.stop(
      ctx.currentTime
      +
      2.4
    );


  }

  catch(error) {}


}



/* =========================================================
   SONIDO DE ACOPLE
   ========================================================= */

function dockingImpactSound() {


  try {


    const ctx =
      getAudioContext();


    /*
      Golpe mecánico grave.
    */

    const impact =
      ctx.createOscillator();


    const impactGain =
      ctx.createGain();


    impact.type =
      "square";


    impact.frequency
      .setValueAtTime(
        115,
        ctx.currentTime
      );


    impact.frequency
      .exponentialRampToValueAtTime(
        42,
        ctx.currentTime
        +
        .2
      );


    impactGain.gain
      .setValueAtTime(
        .24,
        ctx.currentTime
      );


    impactGain.gain
      .exponentialRampToValueAtTime(
        .001,
        ctx.currentTime
        +
        .25
      );


    impact.connect(
      impactGain
    );


    impactGain.connect(
      ctx.destination
    );


    impact.start();


    impact.stop(
      ctx.currentTime
      +
      .26
    );


    /*
      Confirmación electrónica.
    */

    [
      610,
      830
    ]
    .forEach(
      (frequency,index) => {


        const beep =
          ctx.createOscillator();


        const beepGain =
          ctx.createGain();


        const start =
          ctx.currentTime
          +
          .17
          +
          index * .1;


        beep.type =
          "sine";


        beep.frequency.value =
          frequency;


        beepGain.gain
          .setValueAtTime(
            .08,
            start
          );


        beepGain.gain
          .exponentialRampToValueAtTime(
            .001,
            start
            +
            .11
          );


        beep.connect(
          beepGain
        );


        beepGain.connect(
          ctx.destination
        );


        beep.start(
          start
        );


        beep.stop(
          start
          +
          .12
        );


      }
    );


  }

  catch(error) {}


}

/* =========================================================
   MEZCLAR EVENTOS B
   ========================================================= */

function shuffle(
  array
) {


  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {


    const j =
      Math.floor(
        Math.random()
        *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ]
    =
    [
      result[j],
      result[i]
    ];


  }


  return result;


}



function prepareBRooms() {


  const draw =
    shuffle([

      "B1",
      "B2",
      "B3",
      "B4",
      "B5",
      "B6",
      "B7"

    ])
    .slice(
      0,
      3
    );


  [
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    (room,index) => {


      state.rooms[
        room
      ].eventId =
        draw[index];


    }
  );


}

async function toggleMusic() {

      await bgMusic.play();


      musicPlaying =

/* =========================================================
   SONIDO DE DERROTA
   ========================================================= */

function deathSound() {


  try {


    const ctx =
      getAudioContext();


    const now =
      ctx.currentTime;


    [
      430,
      300,
      180,
      95
    ]
    .forEach(
      (frequency,index) => {


        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        oscillator.type =
          index < 2
            ?
            "square"
            :
            "sawtooth";


        oscillator.frequency
          .setValueAtTime(
            frequency,
            now
            +
            index * .09
          );


        gain.gain
          .setValueAtTime(
            .13,
            now
            +
            index * .09
          );


        gain.gain
          .exponentialRampToValueAtTime(
            .001,
            now
            +
            .22
            +
            index * .09
          );


        oscillator.connect(
          gain
        );


        gain.connect(
          ctx.destination
        );


        oscillator.start(
          now
          +
          index * .09
        );


        oscillator.stop(
          now
          +
          .25
          +

        );

function addMapIcon(
  id,
  image,
  room,
  classes
) {


  removeMapIcon(
    id
  );


  const icon =
    document.createElement(
      "img"
    );

  icon.src =
    image;


  icon.draggable =
    false;


  icon.className =
    `map-icon pos-${room} ${classes}`;

) {


  const element =
    document.getElementById(
      id

  if (
    element

    element.remove();


  }


}



/* =========================================================
   CONEXIONES
   ========================================================= */

function getAdjacentRooms(
  room
) {


  if (
    room ===
    "ENTRADA"
  ) {


    return [

      {
        room:
          "A12",

        direction:
          "up"
      }

    ];


  }


  if (
    room ===
    "A12"
  ) {


    return [


      {
        room:
          "B5",

        direction:
          "up"
      },


      {
        room:
          "B6",

        direction:
          "left"
      },


      {
        room:
          "B7",

        direction:
          "right"
      }


    ];


  }


  if (
    room ===
    "B5"
  ) {


    return [

      {
        room:
          "A12",

        direction:
          "down"
      }

    ];


  }


  if (
    room ===
    "B6"
  ) {


    return [

      {
        room:
          "A12",

        direction:
          "right"
      }

    ];


  }


  if (
    room ===
    "B7"
  ) {


    return [

      {
        room:
          "A12",

        direction:
          "left"
      }

    ];


  }


  return [];


}



function roomIsAdjacent(
  roomName
) {


  return getAdjacentRooms(
    state.currentRoom
  )
  .some(
    connection =>
      connection.room ===
      roomName
  );


}



function roomDefinition(
  roomName
) {


  const room =
    state.rooms[
      roomName
    ];


  return room
    ?
    DEFINITIONS[
      room.eventId
    ]
    :
    null;


}

  ]

  ]
  .forEach(

      ) {


        addMapIcon(

          `check-${room}`,

          ASSETS.check,

          room,

          "check-icon"

        );


      }

  );

) {

/* =========================================================
   ESCÁNER ON/OFF
   ========================================================= */

function turnOffScanner() {


  state.scannerActive =
    false;


  scannerButton.classList.remove(
    "scanner-on"
  );


  [
    "A12",
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    room => {


      removeMapIcon(
        `scan-${room}`
      );


    }
  );


}



function scanNearbyRooms() {


  if (
    state.scannerActive
  ) {


    turnOffScanner();


    return;


  }


  const adjacent =
    getAdjacentRooms(
      state.currentRoom
    );


  let count =
    0;


  adjacent.forEach(
    ({
      room,
      direction
    }) => {


      const roomData =
        state.rooms[
          room
        ];


      if (
        roomData
        &&
        !roomData.completed
        &&
        !roomData.revealed
      ) {


        addMapIcon(

          `scan-${room}`,

          ASSETS.scannerWave,

          room,

          `scanner-wave dir-${direction}`

        );


        count++;


      }


    }
  );


  if (
    !count
  ) {


    showMessage(
      "SIN NUEVAS<br>SEÑALES"
    );


    return;


  }


  state.scannerActive =
    true;


  scannerButton.classList.add(
    "scanner-on"
  );


  scannerSound();


}



scannerButton.addEventListener(
  "click",
  scanNearbyRooms
);



/* =========================================================
   REVELAR SALA
   ========================================================= */

function revealRoom(
  roomName
) {


  const room =
    state.rooms[
      roomName
    ];


  const definition =
    roomDefinition(
      roomName
    );


  if (
    !room
    ||
    !definition
  ) {


    return;


  }


  room.revealed =
    true;


  removeMapIcon(
    `scan-${roomName}`
  );


  addMapIcon(

    `event-${roomName}`,

    definition.icon,

    roomName,

    "event-icon"

  );


  energyLossSound();


  showMessage(

    `${definition.label}<br>−2 ENERGÍAS`

  );


}



/* =========================================================
   IMÁGENES CON RESPALDO
   ========================================================= */

function setImageSource(
  imageElement,
  source
) {


  const sources =
    Array.isArray(source)
      ?
      source
      :
      [source];


  let index =
    0;


  imageElement.onerror =
    () => {


      index++;


      if (
        index <
        sources.length
      ) {


        imageElement.src =
          sources[index];


      }

      else {


        imageElement.onerror =
          null;


      }


    };


  imageElement.src =
    sources[0];


}

function resetEncounterUI() {


  encounterCard.className =
    "";


  encounterCard.style.cursor =
    "default";


  enemyHp.style.display =
    "none";


  gunButton.style.display =
    "none";


  fistButton.style.display =
    "none";


  combatLocked =
    false;


  state.combat =
    null;


}



function openEncounter(
  roomName
) {


  const definition =
    roomDefinition(
      roomName
    );


  if (
    !definition
  ) {


    return;


  }


  turnOffScanner();


  state.pendingRoom =
    roomName;


  state.encounterMode =
    definition.type;


  resetEncounterUI();


  setImageSource(
    encounterImage,
    definition.card
  );


  encounterImage.alt =
    definition.label;


  encounter.classList.add(
    "show"
  );


  if (
    definition.type ===
    "combat"
  ) {


    encounterCard.classList.add(
      "combat"
    );


    enemyHp.style.display =
      "flex";


    gunButton.style.display =
      "block";


    fistButton.style.display =
      "block";


    state.combat = {


      eventId:
        state.rooms[
          roomName
        ].eventId,


      hp:
        definition.hp,


      fists:
        0,


      shots:
        0


    };


    enemyHp.textContent =
      definition.hp;


  }

  else {


    encounterCard.style.cursor =
      "pointer";


  }


}



function completeCurrentRoom() {


  const roomName =
    state.pendingRoom;


  if (
    !roomName
  ) {


    return;


  }


  const room =
    state.rooms[
      roomName
    ];


  room.completed =
    true;


  room.revealed =
    true;


  removeMapIcon(
    `event-${roomName}`
  );


  removeMapIcon(
    `scan-${roomName}`
  );


  encounter.classList.remove(
    "show"
  );


  state.pendingRoom =
    null;


  state.encounterMode =
    null;


  resetEncounterUI();


  moveToRoom(
    roomName
  );


}



/* =========================================================
   ATAQUES
   ========================================================= */

function animateHit() {


  encounterCard.classList.remove(
    "hit"
  );


  void encounterCard.offsetWidth;


  encounterCard.classList.add(
    "hit"
  );


}



function attack(
  kind
) {


  if (
    state.encounterMode !==
      "combat"
    ||
    combatLocked
    ||
    !state.combat
  ) {


    return;


  }


  combatLocked =
    true;


  const combat =
    state.combat;


  /* =====================================================
     PUÑO
     ===================================================== */

  if (
    kind ===
    "fist"
  ) {


    combat.fists++;


    punchSound();


    setTimeout(
      lifeLossSound,
      65
    );


    showMessage(
      "−1 VIDA"
    );


  }


  /* =====================================================
     PISTOLA
     ===================================================== */

  else {


    combat.shots++;


    gunSound();


    setTimeout(
      energyLossSound,
      65
    );


    showMessage(
      "−1 ENERGÍA"
    );


  }


  combat.hp =
    Math.max(
      0,
      combat.hp - 1
    );


  enemyHp.textContent =
    combat.hp;


  animateHit();


  setTimeout(
    () => {


      if (
        combat.hp > 0
      ) {


        combatLocked =
          false;


        return;


      }


      const definition =
        DEFINITIONS[
          combat.eventId
        ];


      const earnsClue =

        combat.fists >
          combat.shots

        &&

        !!definition.finalCard;


      if (
        earnsClue
      ) {


        state.encounterMode =
          "final";


        encounterCard.classList.remove(
          "combat"
        );


        enemyHp.style.display =
          "none";


        gunButton.style.display =
          "none";


        fistButton.style.display =
          "none";


        setImageSource(
          encounterImage,
          definition.finalCard
        );


        encounterImage.alt =
          `Pista ${combat.eventId}`;


        encounterCard.style.cursor =
          "pointer";


        combatLocked =
          false;


        return;


      }


      deathSound();


      setTimeout(
        completeCurrentRoom,

        450
      );


    },

    330
  );


}



gunButton.addEventListener(

  "click",

  event => {


    event.stopPropagation();


    attack(
      "gun"
    );


  }

);



fistButton.addEventListener(

  "click",

  event => {


    event.stopPropagation();


    attack(
      "fist"
    );


  }

);



encounterCard.addEventListener(

  "click",

  () => {


    if (
      state.encounterMode ===
      "simple"
    ) {


      completeCurrentRoom();


      return;


    }


    if (
      state.encounterMode ===
      "final"
    ) {


      completeCurrentRoom();


    }


  }

);



/* =========================================================
   HABITACIONES
   ========================================================= */

function handleRoomClick(
  roomName
) {


  const room =
    state.rooms[
      roomName
    ];


  if (
    !room
  ) {


    return;


  }


  if (
    state.currentRoom ===
    roomName
  ) {


    showMessage(
      "ESTÁS EN<br>ESTA SALA"
    );


    return;


  }


  if (
    !roomIsAdjacent(
      roomName
    )
  ) {


    return;


  }


  if (
    room.completed
  ) {


    turnOffScanner();


    moveToRoom(
      roomName
    );


    return;


  }


  if (
    state.scannerActive
    &&
    !room.revealed
  ) {


    revealRoom(
      roomName
    );


    return;


  }


  openEncounter(
    roomName
  );


}



[
  "A12",
  "B5",
  "B6",
  "B7"
]
.forEach(
  room => {


    document
      .getElementById(
        `room${room}`
      )
      .addEventListener(
        "click",
        () => {


          handleRoomClick(
            room
          );


        }
      );


  }
);



/* =========================================================
   EVITAR DOBLE ZOOM
   ========================================================= */

let lastTouchEnd =
  0;


document.addEventListener(

  "touchend",

  event => {


    const now =
      Date.now();


    if (
      now
      -
      lastTouchEnd
      <=
      300
    ) {


      event.preventDefault();


    }


    lastTouchEnd =
      now;


  },

  {
    passive:false
  }

);


</script>
