<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MPL - Estación Espacial</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#050713;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  touch-action:manipulation;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

#game{
  position:relative;
  width:min(100vw,760px);
  margin:0 auto;
  overflow:hidden;
  background:#050713;
  user-select:none;
  -webkit-user-select:none;
}

#map{
  position:relative;
  width:100%;
}

#mapImage{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
}


/* =========================================================
   HABITACIONES
   ========================================================= */

.room{
  position:absolute;
  z-index:20;
  cursor:pointer;
}

#roomA12{
  left:43%;
  top:61.4%;
  width:15.2%;
  height:7.6%;
}

#roomB5{
  left:43%;
  top:51.7%;
  width:15.2%;
  height:7.6%;
}

#roomB6{
  left:26%;
  top:61.4%;
  width:14.8%;
  height:7.6%;
}

#roomB7{
  left:60.2%;
  top:61.4%;
  width:14.8%;
  height:7.6%;
}


/* =========================================================
   ESCÁNER
   ========================================================= */

#scannerButton{
  position:absolute;
  left:38%;
  top:89.3%;
  width:24%;
  height:8.9%;
  z-index:25;
  cursor:pointer;
  animation:scannerPulse 1.8s infinite ease-in-out;
}

#scannerButton.scanner-on{
  animation:scannerOn .9s infinite ease-in-out;
}

@keyframes scannerPulse{
  0%,100%{
    filter:brightness(1);
  }

  50%{
    filter:brightness(1.2);
  }
}

@keyframes scannerOn{
  0%,100%{
    filter:
      brightness(1.15)
      drop-shadow(0 0 5px #a8d336);
  }

  50%{
    filter:
      brightness(1.4)
      drop-shadow(0 0 15px #a8d336);
  }
}


/* =========================================================
   MÚSICA
   ========================================================= */

#musicButton{
  position:absolute;
  top:12px;
  right:12px;
  z-index:70;

  min-height:44px;

  padding:8px 14px;

  border:2px solid #a8d336;
  border-radius:24px;

  background:rgba(10,15,20,.88);

  color:#fff;

  font-size:14px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 0 0 2px rgba(0,0,0,.45),
    0 0 12px rgba(168,211,54,.25);
}

#musicButton:active{
  transform:scale(.94);
}

#musicButton.music-on{
  background:rgba(130,170,30,.92);

  box-shadow:
    0 0 0 2px rgba(0,0,0,.45),
    0 0 18px rgba(168,211,54,.7);
}


/* =========================================================
   ICONOS DEL MAPA
   ========================================================= */

#iconsLayer{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
}

.map-icon{
  position:absolute;
  pointer-events:none;
  object-fit:contain;
}


/* POSICIONES */

.pos-A12{
  left:50.6%;
  top:65.2%;
}

.pos-B5{
  left:50.5%;
  top:55.5%;
}

.pos-B6{
  left:33.4%;
  top:65.1%;
}

.pos-B7{
  left:67.7%;
  top:65.1%;
}


/* JUGADOR */

.player-icon{
  width:13%;

  transform:
    translate(-50%,-50%);

  animation:
    pop
    .35s
    ease-out;

  filter:
    drop-shadow(
      0 0 8px
      rgba(255,255,255,.35)
    );
}


/* EVENTOS */

.event-icon{
  width:12.5%;

  transform:
    translate(-50%,-50%);

  animation:
    pop
    .35s
    ease-out;
}


/* CHECK */

.check-icon{
  width:11.5%;

  transform:
    translate(-50%,-50%);

  animation:
    pop
    .35s
    ease-out;
}


/* ONDAS */

.scanner-wave{
  width:9%;

  animation:
    waveGlow
    1s
    infinite
    ease-in-out;
}


@keyframes pop{

  from{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.25);
  }

  to{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

}


@keyframes waveGlow{

  0%,100%{
    opacity:.62;
    filter:brightness(.95);
  }

  50%{
    opacity:1;
    filter:brightness(1.22);
  }

}


/* DIRECCIÓN DE ONDAS */

.dir-up{
  transform:
    translate(-50%,-50%)
    rotate(0);
}

.dir-right{
  transform:
    translate(-50%,-50%)
    rotate(90deg);
}

.dir-left{
  transform:
    translate(-50%,-50%)
    rotate(-90deg);
}

.dir-down{
  transform:
    translate(-50%,-50%)
    rotate(180deg);
}


/* =========================================================
   PANTALLA DE ENCUENTRO
   ========================================================= */

#encounter{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:12px;

  background:
    rgba(0,0,0,.62);

  opacity:0;
  visibility:hidden;

  transform:
    scale(.96);

  transition:
    opacity .2s ease,
    transform .2s ease;
}

#encounter.show{
  opacity:1;
  visibility:visible;

  transform:
    scale(1);
}


#encounterCard{
  position:relative;

  width:
    min(
      82vw,
      650px
    );

  max-height:94vh;

  cursor:default;
}


#encounterImage{
  display:block;

  width:100%;
  height:auto;

  max-height:94vh;

  object-fit:contain;

  pointer-events:none;
}


/* =========================================================
   ATAQUES
   ========================================================= */

.attack-zone{
  position:absolute;

  z-index:120;

  border:0;

  background:transparent;

  cursor:pointer;

  display:none;
}


/*
  ZONA DE PISTOLA
  lado izquierdo de A12E
*/

#gunButton{
  left:8%;
  top:54%;

  width:30%;
  height:22%;
}


/*
  ZONA DE PUÑO
  lado derecho de A12E
*/

#fistButton{
  left:66%;
  top:54%;

  width:29%;
  height:22%;
}


/* =========================================================
   VIDA DEL ENEMIGO
   ========================================================= */

#enemyHp{
  position:absolute;

  z-index:125;

  left:82.2%;
  top:13.8%;

  transform:
    translate(-50%,-50%);

  display:none;

  min-width:44px;
  height:44px;

  padding:
    0
    10px;

  border-radius:24px;

  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.82);

  border:
    3px solid #fff;

  color:#fff;

  font-size:
    clamp(
      22px,
      5vw,
      34px
    );

  font-weight:900;

  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000;

  pointer-events:none;
}


#encounterCard.combat #gunButton,
#encounterCard.combat #fistButton,
#encounterCard.combat #enemyHp{
  display:flex;
}


/* ANIMACIÓN DE GOLPE */

#encounterCard.hit{
  animation:
    cardHit
    .22s
    ease;
}

@keyframes cardHit{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(.985);
  }

  100%{
    transform:scale(1);
  }

}


/* =========================================================
   MENSAJES
   ========================================================= */

#message{
  position:fixed;

  left:50%;
  top:44%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  z-index:200;

  min-width:240px;
  max-width:85vw;

  padding:
    17px
    25px;

  border-radius:18px;

  background:
    rgba(15,18,22,.95);

  border:
    3px solid
    #a8d336;

  color:#fff;

  font-size:
    clamp(
      20px,
      4.6vw,
      36px
    );

  font-weight:900;

  line-height:1.15;

  text-align:center;

  opacity:0;
  visibility:hidden;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.55),
    0 0 25px rgba(168,211,54,.45);

  pointer-events:none;
}


#message.show{
  visibility:visible;

  animation:
    messageAnimation
    1.35s
    ease
    forwards;
}


@keyframes messageAnimation{

  0%{
    opacity:0;

    transform:
      translate(-50%,-20%)
      scale(.7);
  }

  18%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.06);
  }

  72%{
    opacity:1;

    transform:
      translate(-50%,-60%)
      scale(1);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-95%)
      scale(.95);
  }

}


@media(max-width:500px){

  #musicButton{
    top:8px;
    right:8px;

    min-height:40px;

    padding:
      6px
      10px;

    font-size:12px;
  }

}


@media(min-width:900px){

  #encounterCard{
    width:
      min(
        58vh,
        610px
      );
  }

}

</style>
</head>


<body>


<!-- =========================================================
     MAPA
     ========================================================= -->

<div id="game">

  <div id="map">


    <img
      id="mapImage"
      src="FN1.png"

      draggable="false"
    >

    </button>

      class="room"

    ></div>


    <div
      id="roomB6"
      class="room"
      aria-label="Habitación B6"
    ></div>


    <div
      id="roomB7"
      class="room"
      aria-label="Habitación B7"
    ></div>


    <div
      id="scannerButton"

    ></div>


    <div id="iconsLayer"></div>


  </div>

</div>



<!-- =========================================================

     ========================================================= -->

<audio
  id="bgMusic"
  loop
  preload="auto"
>

  <source
    src="Bitácotas Espaciales.mp3"
    type="audio/mpeg"
  >

</audio>



<!-- =========================================================
     ENCUENTRO
     ========================================================= -->

<div id="encounter">

  <div id="encounterCard">


    <img
      id="encounterImage"
      src=""
      alt="Encuentro"

    >


    <div

      aria-live="polite"
    ></div>


    <button
      id="gunButton"

    <button

      class="attack-zone"
      type="button"
      aria-label="Golpear con el puño"
    ></button>


  </div>

</div>



<div id="message"></div>



<script>


/* =========================================================
   DEFINICIONES DE ENCUENTROS
   ========================================================= */

const DEFINITIONS = {


  /* ---------------------------------------------------------
     A12
     --------------------------------------------------------- */

  A12: {

    card:
      "A12E.png",

    icon:
      "ICOA12.png",

    type:
      "combat",

    label:
      "MARCIANO VERDE",

    hp:
      2,

    finalCard:
      "A12F.png"

  },


  /* ---------------------------------------------------------
     EVENTOS B SIMPLES
     --------------------------------------------------------- */

  B1: {

    card:
      "B1E.png",

    icon:
      "ICOB1.png",

    type:
      "simple",

    label:
      "TRAMPA DE ENERGÍA"

  },


  B2: {

    card:
      "B2E.png",

    icon:
      "ICOB2.png",

    type:
      "simple",

    label:
      "TRAMPA EXPLOSIVA"

  },


  B3: {

    card:
      "B3E.png",

    icon:
      "ICOB3.png",

    type:
      "simple",

    label:
      "OBJETO MISTERIOSO"

  },


  B4: {

    card:
      "B4E.png",

    icon:
      "ICOB4.png",

    type:
      "simple",

    label:
      "KIT DE CURACIÓN"

  },


  /* ---------------------------------------------------------
     ENEMIGOS B
     
     Todavía no definimos su combate.
     --------------------------------------------------------- */

  B5: {

    card:
      "B5E.png",

    icon:
      "ICOB5.png",

    type:
      "combatPending",

    label:
      "ENEMIGO"

  },


  B6: {

    card:
      "B6E.png",

    icon:
      "ICOB6.png",

    type:
      "combatPending",

    label:
      "ENEMIGO"

  },


  B7: {

    card:
      "B7E.png",

    icon:
      "ICOB7.png",

    type:
      "combatPending",

    label:
      "ENEMIGO"

  }

};



/* =========================================================
   ESTADO DEL JUEGO
   ========================================================= */

const state = {


  currentRoom:
    "ENTRADA",


  scannerActive:
    false,


  /*
    Habitación que estamos
    resolviendo actualmente.
  */

  pendingRoom:
    null,


  encounterMode:
    null,


  combat:
    null,


  rooms: {


    A12: {

      eventId:
        "A12",

      revealed:
        false,

      completed:
        false

    },


    B5: {

      eventId:
        null,

      revealed:
        false,

      completed:
        false

    },


    B6: {

      eventId:
        null,

      revealed:
        false,

      completed:
        false

    },


    B7: {

      eventId:
        null,

      revealed:
        false,

      completed:
        false

    }

  }

};



/* =========================================================
   ELEMENTOS
   ========================================================= */

const iconsLayer =
  document.getElementById(
    "iconsLayer"
  );


const scannerButton =
  document.getElementById(
    "scannerButton"
  );


const encounter =
  document.getElementById(
    "encounter"
  );


const encounterCard =
  document.getElementById(
    "encounterCard"
  );


const encounterImage =
  document.getElementById(
    "encounterImage"
  );


const enemyHp =
  document.getElementById(
    "enemyHp"
  );


const gunButton =
  document.getElementById(
    "gunButton"
  );


const fistButton =
  document.getElementById(
    "fistButton"
  );


const message =
  document.getElementById(
    "message"
  );


const bgMusic =
  document.getElementById(
    "bgMusic"
  );


const musicButton =
  document.getElementById(
    "musicButton"
  );



let messageTimer =
  null;


let musicPlaying =
  false;


let combatLocked =
  false;



bgMusic.volume =
  0.32;



/* =========================================================
   MEZCLAR EVENTOS
   ========================================================= */

function shuffle(array) {


  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {


    const j =
      Math.floor(
        Math.random()
        *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ]
    =
    [
      result[j],
      result[i]
    ];


  }


  return result;

}



/* =========================================================
   PREPARAR B5 / B6 / B7
   ========================================================= */

function prepareBRooms() {


  /*
    Hay siete posibles eventos B.

    Se mezclan y tomamos solo tres.

    Así nunca habrá eventos repetidos
    entre B5, B6 y B7.
  */

  const draw =
    shuffle([

      "B1",
      "B2",
      "B3",
      "B4",
      "B5",
      "B6",
      "B7"

    ])
    .slice(
      0,
      3
    );


  [
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    (room, index) => {


      state.rooms[
        room
      ].eventId =
        draw[index];


    }
  );


}



prepareBRooms();



/* =========================================================
   MENSAJES
   ========================================================= */

function showMessage(html) {


  clearTimeout(
    messageTimer
  );


  message.classList.remove(
    "show"
  );


  void message.offsetWidth;


  message.innerHTML =
    html;


  message.classList.add(
    "show"
  );


  messageTimer =
    setTimeout(
      () => {


        message.classList.remove(
          "show"
        );


      },

      1350
    );


}



/* =========================================================
   MÚSICA
   ========================================================= */

async function toggleMusic() {


  if (
    !musicPlaying
  ) {


    try {


      await bgMusic.play();


      musicPlaying =
        true;


      musicButton.classList.add(
        "music-on"
      );


      musicButton.textContent =
        "♫ MÚSICA ON";


      musicButton.setAttribute(
        "aria-label",
        "Desactivar música"
      );


    }

    catch(error) {


      showMessage(
        "NO SE PUDO<br>ACTIVAR LA MÚSICA"
      );


    }


    return;


  }


  bgMusic.pause();


  musicPlaying =
    false;


  musicButton.classList.remove(
    "music-on"
  );


  musicButton.textContent =
    "♫ MÚSICA";


  musicButton.setAttribute(
    "aria-label",
    "Activar música"
  );


}



musicButton.addEventListener(

  "click",

  event => {


    event.stopPropagation();


    toggleMusic();


  }

);



/* =========================================================
   SONIDOS
   ========================================================= */

function createAudioContext() {


  const AudioContext =
    window.AudioContext
    ||
    window.webkitAudioContext;


  return new AudioContext();


}



function scannerSound() {


  try {


    const ctx =
      createAudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency
      .setValueAtTime(
        480,
        ctx.currentTime
      );


    oscillator.frequency
      .linearRampToValueAtTime(
        980,
        ctx.currentTime
        +
        .28
      );


    gain.gain
      .setValueAtTime(
        .08,
        ctx.currentTime
      );


    gain.gain
      .exponentialRampToValueAtTime(
        .001,
        ctx.currentTime
        +
        .4
      );


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    oscillator.start();


    oscillator.stop(
      ctx.currentTime
      +
      .4
    );


  }

  catch(error) {}


}



function deathSound() {


  try {


    const ctx =
      createAudioContext();


    const now =
      ctx.currentTime;


    [
      430,
      300,
      180,
      95
    ]
    .forEach(
      (frequency, index) => {


        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        oscillator.type =
          index < 2
            ?
            "square"
            :
            "sawtooth";


        oscillator.frequency
          .setValueAtTime(

            frequency,

            now
            +
            index * .09

          );


        gain.gain
          .setValueAtTime(

            .13,

            now
            +
            index * .09

          );


        gain.gain
          .exponentialRampToValueAtTime(

            .001,

            now
            +
            .22
            +
            index * .09

          );


        oscillator.connect(
          gain
        );


        gain.connect(
          ctx.destination
        );


        oscillator.start(
          now
          +
          index * .09
        );


        oscillator.stop(
          now
          +
          .25
          +
          index * .09
        );


      }
    );


  }

  catch(error) {}


}



/* =========================================================
   ICONOS
   ========================================================= */

function addMapIcon(
  id,
  image,
  room,
  classes
) {


  removeMapIcon(
    id
  );


  const icon =
    document.createElement(
      "img"
    );


  icon.id =
    id;


  icon.src =
    image;


  icon.draggable =
    false;


  icon.className =
    `map-icon pos-${room} ${classes}`;


  iconsLayer.appendChild(
    icon
  );


  return icon;


}



function removeMapIcon(id) {


  const element =
    document.getElementById(
      id
    );


  if (
    element
  ) {


    element.remove();


  }


}



/* =========================================================
   CONEXIONES
   ========================================================= */

function getAdjacentRooms(room) {


  /* ENTRADA -> A12 */

  if (
    room ===
    "ENTRADA"
  ) {


    return [

      {

        room:
          "A12",

        direction:
          "up"

      }

    ];


  }


  /* A12 -> B5 B6 B7 */

  if (
    room ===
    "A12"
  ) {


    return [


      {

        room:
          "B5",

        direction:
          "up"

      },


      {

        room:
          "B6",

        direction:
          "left"

      },


      {

        room:
          "B7",

        direction:
          "right"

      }


    ];


  }


  /*
    Por ahora dejamos el regreso
    desde las zonas B hacia A12.
  */

  if (
    room ===
    "B5"
  ) {


    return [

      {

        room:
          "A12",

        direction:
          "down"

      }

    ];


  }


  if (
    room ===
    "B6"
  ) {


    return [

      {

        room:
          "A12",

        direction:
          "right"

      }

    ];


  }


  if (
    room ===
    "B7"
  ) {


    return [

      {

        room:
          "A12",

        direction:
          "left"

      }

    ];


  }


  return [];


}



/* =========================================================
   ¿ES ADYACENTE?
   ========================================================= */

function roomIsAdjacent(
  roomName
) {


  return getAdjacentRooms(
    state.currentRoom
  )
  .some(
    connection =>
      connection.room ===
      roomName
  );


}



/* =========================================================
   DEFINICIÓN DEL EVENTO DE UNA SALA
   ========================================================= */

function roomDefinition(
  roomName
) {


  const room =
    state.rooms[
      roomName
    ];


  return room
    ?
    DEFINITIONS[
      room.eventId
    ]
    :
    null;


}



/* =========================================================
   ASTRA Y CHECKS
   ========================================================= */

function refreshMarkers() {


  removeMapIcon(
    "player-marker"
  );


  [
    "A12",
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    room => {


      removeMapIcon(
        `check-${room}`
      );


    }
  );


  /*
    Astra siempre aparece
    donde está actualmente.
  */

  if (
    state.currentRoom !==
    "ENTRADA"
  ) {


    addMapIcon(

      "player-marker",

      "IcoAstra.png",

      state.currentRoom,

      "player-icon"

    );


  }


  /*
    Una sala completada recibe check
    solo después de que Astra salga.
  */

  [
    "A12",
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    room => {


      if (
        state.rooms[
          room
        ].completed
        &&
        state.currentRoom !==
        room
      ) {


        addMapIcon(

          `check-${room}`,

          "icocheck.png",

          room,

          "check-icon"

        );


      }


    }
  );


}



/* =========================================================
   MOVER JUGADOR
   ========================================================= */

function moveToRoom(
  roomName
) {


  state.currentRoom =
    roomName;


  removeMapIcon(
    `event-${roomName}`
  );


  removeMapIcon(
    `scan-${roomName}`
  );


  refreshMarkers();


}



/* =========================================================
   APAGAR ESCÁNER
   ========================================================= */

function turnOffScanner() {


  state.scannerActive =
    false;


  scannerButton.classList.remove(
    "scanner-on"
  );


  [
    "A12",
    "B5",
    "B6",
    "B7"
  ]
  .forEach(
    room => {


      removeMapIcon(
        `scan-${room}`
      );


    }
  );


}



/* =========================================================
   ENCENDER / APAGAR ESCÁNER
   ========================================================= */

function scanNearbyRooms() {


  /*
    SI ESTÁ ENCENDIDO:
    APAGAR.
  */

  if (
    state.scannerActive
  ) {


    turnOffScanner();


    return;


  }


  const adjacent =
    getAdjacentRooms(
      state.currentRoom
    );


  let count =
    0;


  adjacent.forEach(
    ({
      room,
      direction
    }) => {


      const roomData =
        state.rooms[
          room
        ];


      /*
        Solo escaneamos salas
        no completadas y cuyo contenido
        todavía no conocemos.
      */

      if (
        roomData
        &&
        !roomData.completed
        &&
        !roomData.revealed
      ) {


        addMapIcon(

          `scan-${room}`,

          "Esc1.png",

          room,

          `scanner-wave dir-${direction}`

        );


        count++;


      }


    }
  );


  if (
    !count
  ) {


    showMessage(
      "SIN NUEVAS<br>SEÑALES"
    );


    return;


  }


  state.scannerActive =
    true;


  scannerButton.classList.add(
    "scanner-on"
  );


  scannerSound();


}



scannerButton.addEventListener(
  "click",
  scanNearbyRooms
);



/* =========================================================
   REVELAR SALA CON ESCÁNER
   ========================================================= */

function revealRoom(
  roomName
) {


  const room =
    state.rooms[
      roomName
    ];


  const definition =
    roomDefinition(
      roomName
    );


  if (
    !room
    ||
    !definition
  ) {


    return;


  }


  room.revealed =
    true;


  removeMapIcon(
    `scan-${roomName}`
  );


  addMapIcon(

    `event-${roomName}`,

    definition.icon,

    roomName,

    "event-icon"

  );


  /*
    Actualmente conservamos
    el coste que ya definimos
    para usar el escáner.
  */

  showMessage(

    `${definition.label}<br>−2 ENERGÍAS`

  );


}



/* =========================================================
   LIMPIAR INTERFAZ DEL ENCUENTRO
   ========================================================= */

function resetEncounterUI() {


  encounterCard.className =
    "";


  enemyHp.style.display =
    "none";


  gunButton.style.display =
    "none";


  fistButton.style.display =
    "none";


  combatLocked =
    false;


  state.combat =
    null;


}



/* =========================================================
   ABRIR ENCUENTRO
   ========================================================= */

function openEncounter(
  roomName
) {


  const definition =
    roomDefinition(
      roomName
    );


  if (
    !definition
  ) {


    return;


  }


  turnOffScanner();


  state.pendingRoom =
    roomName;


  state.encounterMode =
    definition.type;


  resetEncounterUI();


  encounterImage.src =
    definition.card;


  encounter.classList.add(
    "show"
  );


  /* =====================================================
     COMBATE A12
     ===================================================== */

  if (
    definition.type ===
    "combat"
  ) {


    encounterCard.classList.add(
      "combat"
    );


    enemyHp.style.display =
      "flex";


    gunButton.style.display =
      "block";


    fistButton.style.display =
      "block";


    state.combat = {

      eventId:
        state.rooms[
          roomName
        ].eventId,

      hp:
        definition.hp,

      fists:
        0,

      shots:
        0

    };


    enemyHp.textContent =
      definition.hp;


  }


  /* =====================================================
     EVENTO SIMPLE
     ===================================================== */

  else if (
    definition.type ===
    "simple"
  ) {


    encounterCard.style.cursor =
      "pointer";


  }


  /* =====================================================
     ENEMIGOS B TODAVÍA NO CONFIGURADOS
     ===================================================== */

  else if (
    definition.type ===
    "combatPending"
  ) {


    encounterCard.style.cursor =
      "pointer";


    showMessage(
      "ENFRENTAMIENTO<br>PENDIENTE DE CONFIGURAR"
    );


  }


}



/* =========================================================
   CERRAR ENCUENTRO SIN COMPLETAR
   ========================================================= */

function closeEncounter() {


  encounter.classList.remove(
    "show"
  );


  encounterCard.style.cursor =
    "default";


  state.pendingRoom =
    null;


  state.encounterMode =
    null;


  resetEncounterUI();


}



/* =========================================================
   COMPLETAR SALA ACTUAL
   ========================================================= */

function completeCurrentRoom() {


  const roomName =
    state.pendingRoom;


  if (
    !roomName
  ) {


    return;


  }


  const room =
    state.rooms[
      roomName
    ];


  room.completed =
    true;


  room.revealed =
    true;


  removeMapIcon(
    `event-${roomName}`
  );


  removeMapIcon(
    `scan-${roomName}`
  );


  encounter.classList.remove(
    "show"
  );


  encounterCard.style.cursor =
    "default";


  state.pendingRoom =
    null;


  state.encounterMode =
    null;


  resetEncounterUI();


  /*
    Al resolver el evento,
    Astra queda dentro de esa sala.
  */

  moveToRoom(
    roomName
  );


}



/* =========================================================
   ANIMACIÓN DE ATAQUE
   ========================================================= */

function animateHit() {


  encounterCard.classList.remove(
    "hit"
  );


  void encounterCard.offsetWidth;


  encounterCard.classList.add(
    "hit"
  );


}



/* =========================================================
   ATACAR A12
   ========================================================= */

function attack(
  kind
) {


  if (
    state.encounterMode !==
      "combat"
    ||
    combatLocked
    ||
    !state.combat
  ) {


    return;


  }


  combatLocked =
    true;


  const combat =
    state.combat;


  /* =====================================================
     PUÑO
     ===================================================== */

  if (
    kind ===
    "fist"
  ) {


    combat.fists++;


    /*
      Coste del jugador.
    */

    showMessage(
      "−1 VIDA"
    );


  }


  /* =====================================================
     PISTOLA
     ===================================================== */

  else {


    combat.shots++;


    /*
      Coste del jugador.
    */

    showMessage(
      "−1 ENERGÍA"
    );


  }


  /*
    Cualquier ataque quita 1
    al enemigo.
  */

  combat.hp =
    Math.max(
      0,
      combat.hp - 1
    );


  enemyHp.textContent =
    combat.hp;


  animateHit();


  setTimeout(
    () => {


      /*
        Si aún tiene vida,
        podemos atacar nuevamente.
      */

      if (
        combat.hp > 0
      ) {


        combatLocked =
          false;


        return;


      }


      const definition =
        DEFINITIONS[
          combat.eventId
        ];


      /* =================================================
         A12 DERROTADO CON DOS PUÑOS

         MOSTRAR PISTA
         ================================================= */

      if (
        combat.eventId ===
          "A12"
        &&
        combat.fists ===
          2
        &&
        combat.shots ===
          0
        &&
        definition.finalCard
      ) {


        state.encounterMode =
          "final";


        encounterCard.classList.remove(
          "combat"
        );


        enemyHp.style.display =
          "none";


        gunButton.style.display =
          "none";


        fistButton.style.display =
          "none";


        encounterImage.src =
          definition.finalCard;


        encounterCard.style.cursor =
          "pointer";


        combatLocked =
          false;


        return;


      }


      /* =================================================
         CUALQUIER COMBINACIÓN CON PISTOLA

         DERROTA NORMAL
         ================================================= */

      deathSound();


      setTimeout(
        () => {


          completeCurrentRoom();


        },

        450
      );


    },

    330
  );


}



/* =========================================================
   BOTONES DE ATAQUE
   ========================================================= */

gunButton.addEventListener(

  "click",

  event => {


    event.stopPropagation();


    attack(
      "gun"
    );


  }

);



fistButton.addEventListener(

  "click",

  event => {


    event.stopPropagation();


    attack(
      "fist"
    );


  }

);



/* =========================================================
   TOCAR CARTA
   ========================================================= */

encounterCard.addEventListener(

  "click",

  () => {


    /* =====================================================
       EVENTO SIMPLE

       Un toque lo resuelve.
       ===================================================== */

    if (
      state.encounterMode ===
      "simple"
    ) {


      completeCurrentRoom();


      return;


    }


    /* =====================================================
       PISTA A12F

       Un toque vuelve al mapa.
       ===================================================== */

    if (
      state.encounterMode ===
      "final"
    ) {


      completeCurrentRoom();


      return;


    }


    /* =====================================================
       ENEMIGOS B AÚN SIN REGLAS
       ===================================================== */

    if (
      state.encounterMode ===
      "combatPending"
    ) {


      closeEncounter();


      showMessage(
        "FALTA DEFINIR<br>ESTE COMBATE"
      );


    }


  }

);



/* =========================================================
   TOCAR UNA HABITACIÓN
   ========================================================= */

function handleRoomClick(
  roomName
) {


  const room =
    state.rooms[
      roomName
    ];


  if (
    !room
  ) {


    return;


  }


  /* =====================================================
     YA ESTAMOS AHÍ
     ===================================================== */

  if (
    state.currentRoom ===
    roomName
  ) {


    showMessage(
      "ESTÁS EN<br>ESTA SALA"
    );


    return;


  }


  /* =====================================================
     SOLO SALAS CONECTADAS
     ===================================================== */

  if (
    !roomIsAdjacent(
      roomName
    )
  ) {


    return;


  }


  /* =====================================================
     SALA YA COMPLETADA

     SOLO NOS MOVEMOS.
     ===================================================== */

  if (
    room.completed
  ) {


    turnOffScanner();


    moveToRoom(
      roomName
    );


    return;


  }


  /* =====================================================
     ESCÁNER ENCENDIDO

     REVELAR CONTENIDO.
     ===================================================== */

  if (
    state.scannerActive
    &&
    !room.revealed
  ) {


    revealRoom(
      roomName
    );


    return;


  }


  /* =====================================================
     ESCÁNER APAGADO

     ENTRAR DIRECTAMENTE
     AUN SIN HABER ESCANEADO.
     ===================================================== */

  openEncounter(
    roomName
  );


}



/* =========================================================
   EVENTOS DE HABITACIONES
   ========================================================= */

[
  "A12",
  "B5",
  "B6",
  "B7"
]
.forEach(
  room => {


    document
      .getElementById(
        `room${room}`
      )
      .addEventListener(
        "click",
        () => {


          handleRoomClick(
            room
          );


        }
      );


  }
);



/* =========================================================
   EVITAR DOBLE ZOOM EN MÓVIL
   ========================================================= */

let lastTouchEnd =
  0;


document.addEventListener(

  "touchend",

  event => {


    const now =
      Date.now();


    if (
      now
      -
      lastTouchEnd
      <=
      300
    ) {


      event.preventDefault();


    }


    lastTouchEnd =
      now;


  },

  {
    passive:false
  }

);


</script>
