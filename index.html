<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MPL - Estación Espacial</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#050713;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  touch-action:manipulation;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

img{
  user-select:none;
  -webkit-user-drag:none;
}

button{
  font-family:inherit;
}

/* =========================================================
   INTRO
   ========================================================= */

#introOverlay{
  position:relative;
  width:min(100vw,760px);
  margin:0 auto;
  background:#050713;
  overflow:hidden;
}

.intro-page{
  display:none;
  position:relative;
  width:100%;
  animation:introFade .28s ease;
}

.intro-page.active{
  display:block;
}

.intro-image,
.dock-base{
  display:block;
  width:100%;
  height:auto;
}

#introPage1{
  cursor:pointer;
}

#acceptMissionButton{
  position:absolute;
  left:50%;
  bottom:4.5%;
  transform:translateX(-50%);
  z-index:10;
  min-width:180px;
  padding:14px 28px;
  border:3px solid #ffc164;
  border-radius:18px;
  background:rgba(190,92,0,.93);
  color:#fff;
  font-size:clamp(19px,4vw,28px);
  font-weight:900;
  letter-spacing:.8px;
  cursor:pointer;
  box-shadow:
    0 0 0 3px rgba(0,0,0,.45),
    0 0 22px rgba(255,142,22,.65);
}

#acceptMissionButton:active{
  transform:translateX(-50%) scale(.96);
}

/* =========================================================
   DOCKING
   ========================================================= */

#dockScene{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#050713;
}

#dockShip{
  position:absolute;
  left:50%;
  top:111%;
  width:25%;
  height:auto;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 14px rgba(255,139,30,.6));
  z-index:5;
}

#dockShip.docking{
  animation:dockMove 2.25s cubic-bezier(.25,.75,.25,1) forwards;
}

#dockFlash{
  position:absolute;
  inset:0;
  z-index:8;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#dockFlash.flash{
  animation:dockFlash .28s ease;
}

@keyframes introFade{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes dockMove{
  0%{
    top:112%;
    transform:translate(-50%,-50%) scale(.92);
  }

  22%{
    top:99%;
    transform:translate(-50%,-50%) scale(.95);
  }

  70%{
    top:81%;
    transform:translate(-50%,-50%) scale(.99);
  }

  100%{
    top:74.6%;
    transform:translate(-50%,-50%) scale(1);
  }
}

@keyframes dockFlash{
  0%{opacity:0;}
  45%{opacity:.35;}
  100%{opacity:0;}
}

/* =========================================================
   GAME
   ========================================================= */

#game{
  display:none;
  position:relative;
  width:min(100vw,760px);
  margin:0 auto;
  overflow:hidden;
  background:#050713;
  user-select:none;
  -webkit-user-select:none;
}

#map{
  position:relative;
  width:100%;
}

#mapImage{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
}

#roomsLayer,
#iconsLayer{
  position:absolute;
  inset:0;
}

#roomsLayer{
  z-index:20;
}

#iconsLayer{
  z-index:30;
  pointer-events:none;
}

.room{
  position:absolute;
  transform:translate(-50%,-50%);
  cursor:pointer;
  background:transparent;
  border:0;
}

/* =========================================================
   MAP ICONS
   ========================================================= */

.map-icon{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:none;
  object-fit:contain;
}

.player-icon{
  width:12.5%;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.35));
  animation:pop .3s ease-out;
}

.event-icon{
  width:11.5%;
  animation:pop .3s ease-out;
}

.check-icon{
  width:10%;
  animation:pop .3s ease-out;
}

.scanner-wave{
  width:8.5%;
  animation:waveGlow 1s infinite ease-in-out;
}

.dir-up{
  transform:translate(-50%,-50%) rotate(0deg);
}

.dir-right{
  transform:translate(-50%,-50%) rotate(90deg);
}

.dir-left{
  transform:translate(-50%,-50%) rotate(-90deg);
}

.dir-down{
  transform:translate(-50%,-50%) rotate(180deg);
}

@keyframes pop{
  from{
    opacity:0;
    scale:.35;
  }

  to{
    opacity:1;
    scale:1;
  }
}

@keyframes waveGlow{
  0%,100%{
    opacity:.58;
    filter:brightness(.95);
  }

  50%{
    opacity:1;
    filter:
      brightness(1.3)
      drop-shadow(0 0 7px rgba(168,211,54,.65));
  }
}

/* =========================================================
   MAP CONTROLS
   ========================================================= */

#scannerButton{
  position:absolute;
  left:36%;
  top:88.4%;
  width:28%;
  height:10.8%;
  z-index:40;
  cursor:pointer;
  background:transparent;
  border:0;
}

#scannerButton.scanner-on{
  filter:drop-shadow(0 0 12px #a8d336);
}

#useObjectButton{
  position:absolute;
  left:77%;
  top:5.2%;
  width:20%;
  height:18%;
  z-index:40;
  cursor:pointer;
  background:transparent;
  border:0;
}

#musicButton{
  position:absolute;
  left:2.2%;
  bottom:1.3%;
  z-index:60;
  width:44px;
  height:44px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:50%;
  background:rgba(10,15,20,.76);
  color:#fff;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,0,0,.5);
}

#musicButton.music-on{
  box-shadow:
    0 0 0 2px rgba(0,0,0,.4),
    0 0 15px rgba(168,211,54,.65);
}

/* =========================================================
   OXYGEN
   ========================================================= */

#oxygenCounter{
  position:absolute;
  left:5.1%;
  top:23.2%;
  width:12.4%;
  z-index:55;
  padding:5px 3px;
  border-radius:10px;
  background:rgba(9,13,18,.78);
  border:2px solid rgba(255,255,255,.72);
  color:#fff;
  text-align:center;
  font-size:clamp(13px,2.9vw,23px);
  font-weight:900;
  text-shadow:1px 2px 2px #000;
  pointer-events:none;
}

#oxygenCounter.phase60{
  border-color:#ff9140;
  color:#ffb176;
}

#oxygenCounter.phase20{
  border-color:#ff4141;
  color:#ff7777;
}

/* =========================================================
   TUTORIAL
   ========================================================= */

#tutorialOverlay{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.62);
}

#tutorialOverlay.show{
  display:flex;
}

#tutorialPanel{
  width:min(88vw,620px);
  padding:24px 22px;
  border-radius:20px;
  background:rgba(19,22,27,.97);
  border:3px solid #a8d336;
  box-shadow:
    0 0 0 3px rgba(0,0,0,.55),
    0 0 26px rgba(168,211,54,.35);
  text-align:center;
  color:#fff;
}

#tutorialText{
  font-size:clamp(20px,4vw,31px);
  font-weight:800;
  line-height:1.25;
  margin-bottom:20px;
}

#tutorialNext{
  min-width:150px;
  padding:11px 22px;
  border:0;
  border-radius:14px;
  background:#a8d336;
  color:#111;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

/* =========================================================
   ENCOUNTER
   ========================================================= */

#encounter{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  background:rgba(0,0,0,.66);
  opacity:0;
  visibility:hidden;
  transform:scale(.96);
  transition:
    opacity .18s ease,
    transform .18s ease;
}

#encounter.show{
  opacity:1;
  visibility:visible;
  transform:scale(1);
}

#encounterCard{
  position:relative;
  width:min(82vw,650px);
  max-height:94vh;
  cursor:default;
}

#encounterImage{
  display:block;
  width:100%;
  height:auto;
  max-height:94vh;
  object-fit:contain;
  pointer-events:none;
}

.attack-zone{
  position:absolute;
  z-index:125;
  border:0;
  background:transparent;
  cursor:pointer;
  display:none;
}

#gunButton{
  left:6%;
  top:51%;
  width:35%;
  height:27%;
}

#fistButton{
  left:62%;
  top:51%;
  width:35%;
  height:27%;
}

/* =========================================================
   ENEMY HP
   ========================================================= */

#enemyHp{
  position:absolute;
  z-index:130;
  left:82%;
  top:12.5%;
  transform:translate(-50%,-50%);
  display:none;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  color:#fff;
  font-size:clamp(25px,6vw,38px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    2px 2px 0 #000,
    -2px -2px 0 #000,
    0 0 5px #000;
  pointer-events:none;
}

#encounterCard.combat #gunButton,
#encounterCard.combat #fistButton,
#encounterCard.combat #enemyHp{
  display:flex;
}

#encounterBackButton{
  display:none;
  position:absolute;
  left:50%;
  bottom:3.5%;
  transform:translateX(-50%);
  z-index:135;
  padding:10px 20px;
  border:2px solid #fff;
  border-radius:14px;
  background:rgba(20,23,28,.9);
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

#encounterCard.hit{
  animation:cardHit .2s ease;
}

@keyframes cardHit{
  0%{transform:scale(1);}
  45%{transform:scale(.985);}
  100%{transform:scale(1);}
}

/* =========================================================
   MESSAGE
   ========================================================= */

#message{
  position:fixed;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:210;
  min-width:240px;
  max-width:85vw;
  padding:17px 25px;
  border-radius:18px;
  background:rgba(15,18,22,.96);
  border:3px solid #a8d336;
  color:#fff;
  font-size:clamp(19px,4.3vw,33px);
  font-weight:900;
  line-height:1.15;
  text-align:center;
  opacity:0;
  visibility:hidden;
  box-shadow:
    0 0 0 3px rgba(0,0,0,.55),
    0 0 25px rgba(168,211,54,.45);
  pointer-events:none;
}

#message.show{
  visibility:visible;
  animation:messageAnimation 1.4s ease forwards;
}

@keyframes messageAnimation{
  0%{
    opacity:0;
    transform:translate(-50%,-20%) scale(.7);
  }

  18%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.06);
  }

  72%{
    opacity:1;
    transform:translate(-50%,-60%) scale(1);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-95%) scale(.95);
  }
}

/* =========================================================
   END
   ========================================================= */

#endOverlay{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(3,5,12,.95);
}

#endOverlay.show{
  display:flex;
}

#endPanel{
  width:min(88vw,640px);
  padding:36px 25px;
  border-radius:24px;
  background:rgba(17,20,25,.96);
  border:4px solid #fff;
  text-align:center;
  box-shadow:0 0 35px rgba(255,255,255,.18);
}

#endTitle{
  margin:0 0 14px;
  color:#fff;
  font-size:clamp(40px,9vw,72px);
  font-weight:1000;
}

#endSubtitle{
  margin:0;
  color:#ddd;
  font-size:clamp(18px,4vw,28px);
  font-weight:700;
  line-height:1.25;
}

#endOverlay.mission #endPanel{
  border-color:#a8d336;
  box-shadow:0 0 36px rgba(168,211,54,.38);
}

#endOverlay.mission #endTitle{
  color:#b9e84a;
}

#endOverlay.gameover #endPanel{
  border-color:#ff4141;
  box-shadow:0 0 36px rgba(255,65,65,.4);
}

#endOverlay.gameover #endTitle{
  color:#ff5959;
}

@media(max-width:500px){

  #acceptMissionButton{
    min-width:145px;
    padding:11px 20px;
  }

  #musicButton{
    width:39px;
    height:39px;
    font-size:17px;
  }

}

@media(min-width:900px){

  #encounterCard{
    width:min(58vh,610px);
  }

}

<audio id="introMusic" loop preload="auto">

</div>


<div id="message"></div>


<div id="endOverlay">

</div>

   ========================================================= */

const B_ROOMS = [
  "B1",
  "B2",
  "B3",
  "B4",
  "B5",
  "B6",
  "B7"
];


/*
  Devuelve un número aleatorio entre 0 y max-1.

  Se usa crypto cuando está disponible
  para evitar patrones demasiado repetitivos.
*/

function randomIndex(max){

  if(
    window.crypto
    &&
    window.crypto.getRandomValues
  ){

    const data =
      new Uint32Array(1);

    window.crypto.getRandomValues(
      data
    );

    return data[0] % max;

  }

  return Math.floor(
    Math.random() * max
  );

}


/*
  Baraja los 7 eventos B mediante
  Fisher-Yates.
*/

function shuffleArray(
  array
){

  for(
    let i = array.length - 1;
    i > 0;
    i--
  ){

    const j =
      randomIndex(
        i + 1
      );

    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }

  return array;

}


/*
  Cada zona B conserva su posición física
  y sus conexiones.

  Lo que cambia es el evento que contiene.
*/

function randomizeBEncounters(){

  const originalEvents =
    B_ROOMS.map(
      room =>
        DEFINITIONS[
          room
        ]
    );


  const shuffledEvents =
    shuffleArray(
      [
        ...originalEvents
      ]
    );


  /*
    Aunque es poco probable,
    un barajado aleatorio podría quedar
    exactamente igual al original.

    Para evitar que al probar parezca
    que "no aleatorizó", si ocurre eso
    desplazamos todos los eventos una posición.
  */

  const sameAsOriginal =
    shuffledEvents.every(
      (event,index) =>
        event ===
        originalEvents[
          index
        ]
    );


  if(
    sameAsOriginal
  ){

    const first =
      shuffledEvents.shift();

    shuffledEvents.push(
      first
    );

  }


  /*
    Asignar evento aleatorio a cada
    ubicación B.
  */

  B_ROOMS.forEach(
    (room,index) => {

      DEFINITIONS[
        room
      ] =
        shuffledEvents[
          index
        ];

    }
  );


  /*
    Solo para depuración.
    No aparece visualmente en el juego.
  */

  console.log(
    "Distribución B de esta partida:",
    B_ROOMS.map(
      room => ({
        room,
        event:
          DEFINITIONS[
            room
          ].sourceId
      })
    )
  );

}

*/

function getAudioContext(){

  if(
    !gameAudioContext
  ){

    const AudioContext =
      window.AudioContext
      ||
      window.webkitAudioContext;

    gameAudioContext =
      new AudioContext();

  }

  if(
    gameAudioContext.state ===
    "suspended"
  ){

    gameAudioContext.resume();

  }

  return gameAudioContext;

}


function toneSweep(
  startFreq,
  endFreq,
  duration,
  volume=.1,
  type="sine"
){

  try{

    const ctx =
      getAudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type =
      type;

    oscillator.frequency
      .setValueAtTime(
        startFreq,
        ctx.currentTime
      );

    oscillator.frequency
      .exponentialRampToValueAtTime(
        Math.max(
          20,
          endFreq
        ),
        ctx.currentTime
        +
        duration
      );

    gain.gain
      .setValueAtTime(
        volume,
        ctx.currentTime
      );

    gain.gain
      .exponentialRampToValueAtTime(
        .001,
        ctx.currentTime
        +
        duration
      );

    oscillator.connect(
      gain
    );

    gain.connect(
      ctx.destination
    );

    oscillator.start();

    oscillator.stop(
      ctx.currentTime
      +
      duration
      +
      .02
    );

  }
  catch(error){}

}

    oscillator2.type =

function dockingTravelSound(){

  try{

    const ctx =
      getAudioContext();

    const master =
      ctx.createGain();

    const low =
      ctx.createOscillator();

    const high =
      ctx.createOscillator();

    const filter =
      ctx.createBiquadFilter();

    low.type =
      "sawtooth";

    high.type =
      "triangle";

    low.frequency
      .setValueAtTime(
        58,
        ctx.currentTime
      );

    low.frequency
      .linearRampToValueAtTime(
        98,
        ctx.currentTime
        +
        2.25
      );

    high.frequency
      .setValueAtTime(
        118,
        ctx.currentTime
      );

    high.frequency
      .linearRampToValueAtTime(
        185,
        ctx.currentTime
        +
        2.25
      );

    filter.type =
      "lowpass";

    filter.frequency
      .setValueAtTime(
        520,
        ctx.currentTime
      );

    filter.frequency
      .linearRampToValueAtTime(
        900,
        ctx.currentTime
        +
        2.1
      );

    master.gain
      .setValueAtTime(
        .001,
        ctx.currentTime
      );

    master.gain
      .linearRampToValueAtTime(
        .11,
        ctx.currentTime
        +
        .25
      );

    master.gain
      .setValueAtTime(
        .11,
        ctx.currentTime
        +
        1.65
      );

    master.gain
      .exponentialRampToValueAtTime(
        .001,
        ctx.currentTime
        +
        2.35
      );

    low.connect(
      filter
    );

    high.connect(
      filter
    );

    filter.connect(
      master
    );

    master.connect(
      ctx.destination
    );

    low.start();

    high.start();

    low.stop(
      ctx.currentTime
      +
      2.4
    );

    high.stop(
      ctx.currentTime
      +
      2.4
    );

  }
  catch(error){}

}

function crossfadeToGameMusic(){

  bgMusic.volume =
    .03;

  bgMusic
    .play()
    .then(
      () => {

        musicPlaying =
          true;

        musicButton.classList.add(
          "music-on"
        );

      }
    )
    .catch(
      () => {}
    );

  const steps =
    18;

  let current =
    0;

  const introStart =
    introMusic.volume;

  const timer =
    setInterval(
      () => {

        current++;

        const progress =
          current
          /
          steps;

        introMusic.volume =
          Math.max(
            0,
            introStart
            *
            (
              1
              -
              progress
            )
          );

        bgMusic.volume =
          .03
          +
          (
            .32
            -
            .03
          )
          *
          progress;

        if(
          current >=
          steps
        ){

          clearInterval(
            timer
          );

          introMusic.pause();

          introMusic.currentTime =
            0;

          introMusic.volume =
            .34;

          bgMusic.volume =
            .32;

        }

      },
      65
    );

}

      value

      value

      value

        .replace(
          ".",

        )
  }%`;

  }

function consumeOxygen(
  amount
){

  if(
    state.ended
  ){
    return false;
  }

  state.oxygen =
    Math.max(
      0,
      Math.round(
        (
          state.oxygen
          -
          amount
        )
        *
        10
      )
      /
      10
    );

  updateOxygenUI();

  if(
    state.oxygen <=
    0
  ){

    triggerGameOver();

    return false;

  }

  return true;

}

    targetRoom ===
      "A1"
    &&
    keyCount() >=
      2
  ){

    return 0;

  }

  if(
    state.rooms[
      targetRoom
    ]
    &&
    state.rooms[
      targetRoom
    ].visited
  ){

    return 2.5;

  }

  return 5;

}


/* =========================================================
   USE OBJECT
   ========================================================= */

useObjectButton.addEventListener(

  "click",

  () => {

    if(
      state.gameLocked
      ||
      state.ended
      ||
      encounter.classList.contains(
        "show"
      )
    ){
      return;
    }

    itemSound();

    const alive =
      consumeOxygen(
        5
      );

    if(
      alive
    ){

      showMessage(
        "OBJETO UTILIZADO<br>−5% O₂"
      );

    }

  }

);


/* =========================================================
   KEYS
   ========================================================= */

function keyCount(){

  return Object
    .values(
      state.keySources
    )
    .filter(
      Boolean
    )
    .length;

}


function grantKey(
  source
){

  if(
    !state.keySources[
      source
    ]
  ){

    state.keySources[
      source
    ] =
      true;

    showMessage(
      "TARJETA LLAVE OBTENIDA"
    );

  }

}


/* =========================================================
   MAP ICONS
   ========================================================= */

function addMapIcon(
  id,
  image,
  room,
  classes,
  direction=""
){

  removeMapIcon(
    id
  );

  const position =
    ROOM_LAYOUT[
      room
    ];

  if(
    !position
  ){
    return null;
  }

  const icon =
    document.createElement(
      "img"
    );

  icon.id =
    id;

  icon.src =
    image;

  icon.draggable =
    false;

  icon.className =
    `map-icon ${classes}${
      direction
        ?
        ` dir-${direction}`
        :
        ""
    }`;

  icon.style.left =
    `${position.x}%`;

  icon.style.top =
    `${position.y}%`;

  iconsLayer.appendChild(
    icon
  );

  return icon;

}


function removeMapIcon(
  id
){

  const element =
    document.getElementById(
      id
    );

  if(
    element
  ){

    element.remove();

  }

}


function clearStandardMarkers(){

  removeMapIcon(
    "player-marker"
  );

  Object
    .keys(
      DEFINITIONS
    )
    .forEach(
      room => {

        removeMapIcon(
          `check-${room}`
        );

        removeMapIcon(
          `event-${room}`
        );

      }
    );

}


function refreshRoomMarkers(){

  clearStandardMarkers();

  if(
    state.currentRoom !==
    "ENTRADA"
  ){

    addMapIcon(
      "player-marker",
      ASSETS.playerIcon,
      state.currentRoom,
      "player-icon"
    );

  }

  Object
    .keys(
      DEFINITIONS
    )
    .forEach(
      room => {

        const roomState =
          state.rooms[
            room
          ];

        if(
          room ===
          state.currentRoom
        ){
          return;
        }

        if(
          roomState.completed
        ){

          addMapIcon(
            `check-${room}`,
            ASSETS.check,
            room,
            "check-icon"
          );

          return;

        }

        if(
          roomState.revealed
        ){

          addMapIcon(
            `event-${room}`,
            DEFINITIONS[
              room
            ].icon,
            room,
            "event-icon"
          );

        }

      }
    );

}


function moveToRoom(
  room
){

  state.currentRoom =
    room;

  state.rooms[
    room
  ].visited =
    true;

  refreshRoomMarkers();

}


/* =========================================================
   SCANNER
   ========================================================= */

function adjacentRooms(){

  return GRAPH[
    state.currentRoom
  ]
  ||
  [];

}


function isAdjacent(
  target
){

  return adjacentRooms()
    .includes(
      target
    );

}


function directionBetween(
  from,
  to
){

  if(
    from ===
    "ENTRADA"
  ){
    return "up";
  }

  const start =
    ROOM_LAYOUT[
      from
    ];

  const end =
    ROOM_LAYOUT[
      to
    ];

  if(
    !start
    ||
    !end
  ){
    return "up";
  }

  const dx =
    end.x
    -
    start.x;

  const dy =
    end.y
    -
    start.y;

  if(
    Math.abs(
      dx
    )
    >
    Math.abs(
      dy
    )
  ){

    return dx > 0
      ?
      "right"
      :
      "left";

  }

  return dy > 0
    ?
    "down"
    :
    "up";

}


function turnOffScanner(){

  state.scannerActive =
    false;

  scannerButton.classList.remove(
    "scanner-on"
  );

  Object
    .keys(
      DEFINITIONS
    )
    .forEach(
      room => {

        removeMapIcon(
          `scan-${room}`
        );

      }
    );

}


function scanNearbyRooms(){

  if(
    state.gameLocked
    ||
    state.ended
    ||
    encounter.classList.contains(
      "show"
    )
  ){
    return;
  }

  if(
    state.scannerActive
  ){

    turnOffScanner();

    return;

  }

  let count =
    0;

  adjacentRooms()
    .forEach(
      room => {

        const roomState =
          state.rooms[
            room
          ];

        if(
          !roomState.completed
          &&
          !roomState.revealed
        ){

          addMapIcon(
            `scan-${room}`,
            ASSETS.scannerWave,
            room,
            "scanner-wave",
            directionBetween(
              state.currentRoom,
              room
            )
          );

          count++;

        }

      }
    );

  if(
    !count
  ){

    showMessage(
      "SIN NUEVAS SEÑALES"
    );

    return;

  }

  state.scannerActive =
    true;

  scannerButton.classList.add(
    "scanner-on"
  );

  scannerSound();

}


scannerButton.addEventListener(

  "click",

  scanNearbyRooms

);


function revealRoom(
  room
){

  const roomState =
    state.rooms[
      room
    ];

  const definition =
    DEFINITIONS[
      room
    ];

  if(
    !roomState
    ||
    !definition
  ){
    return;
  }

  roomState.revealed =
    true;

  removeMapIcon(
    `scan-${room}`
  );

  addMapIcon(
    `event-${room}`,
    definition.icon,
    room,
    "event-icon"
  );

  energyLossSound();

  showMessage(
    `${definition.label}<br>−2 ENERGÍAS`
  );

}


/* =========================================================
   ENCOUNTER
   ========================================================= */

function setEncounterImage(
  src
){

  encounterImage.onerror =
    null;

  encounterImage.src =
    src;

}


function resetEncounterUI(){

  encounterCard.className =
    "";

  encounterCard.style.cursor =
    "default";

  enemyHp.style.display =
    "none";

  gunButton.style.display =
    "none";

  fistButton.style.display =
    "none";

  encounterBackButton.style.display =
    "none";

  combatLocked =
    false;

  state.combat =
    null;

}


function currentEnemyHp(
  definition
){

  const phase =
    oxygenPhase();

  return definition.hp
    ?
    definition.hp[
      phase
    ]
    :
    0;

}


function openEncounter(
  room
){

  const definition =
    DEFINITIONS[
      room
    ];

  if(
    !definition
  ){
    return;
  }

  turnOffScanner();

  state.pendingRoom =
    room;

  state.rooms[
    room
  ].visited =
    true;

  resetEncounterUI();

  setEncounterImage(
    definition.card
  );

  encounterImage.alt =
    definition.label;

  encounter.classList.add(
    "show"
  );


  if(
    definition.type ===
    "combat"
  ){

    state.encounterMode =
      "combat";

    encounterCard.classList.add(
      "combat"
    );

    enemyHp.style.display =
      "flex";

    gunButton.style.display =
      "block";

    fistButton.style.display =
      "block";

    const hp =
      currentEnemyHp(
        definition
      );

    state.combat = {

      room:
        room,

      sourceId:
        definition.sourceId
        ||
        room,

      hp:
        hp,

      fists:
        0,

      shots:
        0

    };

    enemyHp.textContent =
      hp;

    return;

  }


  if(
    definition.type ===
    "loot"
  ){

    if(
      keyCount() >=
      2
    ){

      state.encounterMode =
        "lootReady";

      encounterCard.style.cursor =
        "pointer";

    }

    else{

      state.encounterMode =
        "lootLocked";

      encounterCard.style.cursor =
        "pointer";

      encounterBackButton.style.display =
        "block";

    }

    return;

  }


  state.encounterMode =
    definition.type;

  encounterCard.style.cursor =
    "pointer";

}


function completeCurrentRoom(){

  const room =
    state.pendingRoom;

  if(
    !room
  ){
    return;
  }

  state.rooms[
    room
  ].completed =
    true;

  state.rooms[
    room
  ].revealed =
    true;

  encounter.classList.remove(
    "show"
  );

  state.pendingRoom =
    null;

  state.encounterMode =
    null;

  resetEncounterUI();

  moveToRoom(
    room
  );

}


function closeUnresolvedRoomToMap(){

  const room =
    state.pendingRoom;

  if(
    !room
  ){
    return;
  }

  state.rooms[
    room
  ].revealed =
    true;

  encounter.classList.remove(
    "show"
  );

  state.pendingRoom =
    null;

  state.encounterMode =
    null;

  resetEncounterUI();

  moveToRoom(
    room
  );

}


function animateHit(){

  encounterCard.classList.remove(
    "hit"
  );

  void encounterCard.offsetWidth;

  encounterCard.classList.add(
    "hit"
  );

}


/* =========================================================
   COMBAT
   ========================================================= */

function attack(
  kind
){

  if(
    state.encounterMode !==
      "combat"
    ||
    combatLocked
    ||
    !state.combat
    ||
    state.ended
  ){
    return;
  }

  combatLocked =
    true;

  const combat =
    state.combat;


  if(
    kind ===
    "fist"
  ){

    combat.fists++;

    punchSound();

    setTimeout(
      lifeLossSound,
      65
    );

    showMessage(
      "−1 VIDA"
    );

  }

  else{

    combat.shots++;

    gunSound();

    setTimeout(
      energyLossSound,
      65
    );

    showMessage(
      "−1 ENERGÍA"
    );

  }


  combat.hp =
    Math.max(
      0,
      combat.hp
      -
      1
    );

  enemyHp.textContent =
    combat.hp;

  animateHit();


  setTimeout(
    () => {

      if(
        combat.hp >
        0
      ){

        combatLocked =
          false;

        return;

      }


      /*
        La definición se obtiene por la
        HABITACIÓN física actual.

        Como los B ya fueron barajados,
        aquí carga correctamente el evento
        que realmente quedó en esa posición.
      */

      const definition =
        DEFINITIONS[
          combat.room
        ];


      /*
        PISTA:
        PUÑOS >= PISTOLAS
      */

      const earnsFinal =

        combat.fists >=
          combat.shots

        &&

        combat.fists >
          0

        &&

        !!definition.finalCard;


      if(
        earnsFinal
      ){

        state.encounterMode =
          "final";

        encounterCard.classList.remove(
          "combat"
        );

        enemyHp.style.display =
          "none";

        gunButton.style.display =
          "none";

        fistButton.style.display =
          "none";

        setEncounterImage(
          definition.finalCard
        );

        encounterImage.alt =
          `Desenlace ${combat.sourceId}`;

        encounterCard.style.cursor =
          "pointer";


        /*
          Solo A5 entrega la llave especial.
          Los encuentros B no pueden activar
          accidentalmente esta condición aunque
          hayan sido aleatorizados.
        */

        if(
          combat.sourceId ===
          "A5"
        ){

          grantKey(
            "A5"
          );

        }


        combatLocked =
          false;

        return;

      }


      deathSound();

      setTimeout(
        completeCurrentRoom,
        430
      );

    },
    320
  );

}


gunButton.addEventListener(

  "click",

  event => {

    event.stopPropagation();

    attack(
      "gun"
    );

  }

);


fistButton.addEventListener(

  "click",

  event => {

    event.stopPropagation();

    attack(
      "fist"
    );

  }

);


encounterBackButton.addEventListener(

  "click",

  event => {

    event.stopPropagation();

    if(
      state.encounterMode ===
      "lootLocked"
    ){

      closeUnresolvedRoomToMap();

    }

  }

);


/* =========================================================
   ENCOUNTER CLICK
   ========================================================= */

encounterCard.addEventListener(

  "click",

  () => {


    if(
      state.encounterMode ===
      "simple"
    ){

      completeCurrentRoom();

      return;

    }


    if(
      state.encounterMode ===
      "key"
    ){

      const room =
        state.pendingRoom;

      const definition =
        DEFINITIONS[
          room
        ];

      grantKey(
        definition.keySource
      );

      completeCurrentRoom();

      return;

    }


    if(
      state.encounterMode ===
      "final"
    ){

      completeCurrentRoom();

      return;

    }


    if(
      state.encounterMode ===
      "lootLocked"
    ){

      showMessage(
        "NECESITAS 2 TARJETAS LLAVE"
      );

      return;

    }


    if(
      state.encounterMode ===
      "lootReady"
    ){

      state.encounterMode =
        "missionFinal";

      setEncounterImage(
        DEFINITIONS.A1.finalCard
      );

      encounterBackButton.style.display =
        "none";

      return;

    }


    if(
      state.encounterMode ===
      "missionFinal"
    ){

      state.rooms.A1.completed =
        true;

      state.rooms.A1.revealed =
        true;

      missionComplete();

    }

  }

);


/* =========================================================
   MOVEMENT
   ========================================================= */

function handleRoomClick(
  room
){

  if(
    state.gameLocked
    ||
    state.ended
    ||
    encounter.classList.contains(
      "show"
    )
  ){
    return;
  }


  if(
    room ===
    state.currentRoom
  ){

    showMessage(
      "ESTÁS EN ESTA SALA"
    );

    return;

  }


  if(
    !isAdjacent(
      room
    )
  ){

    showMessage(
      "SOLO PUEDES IR A UNA SALA ALEDAÑA"
    );

    return;

  }


  if(
    state.scannerActive
    &&
    !state.rooms[
      room
    ].revealed
  ){

    revealRoom(
      room
    );

    return;

  }


  const movementCost =
    getMovementOxygenCost(
      room
    );


  if(
    movementCost >
    0
  ){

    const alive =
      consumeOxygen(
        movementCost
      );

    if(
      !alive
    ){
      return;
    }

  }


  if(
    state.rooms[
      room
    ].completed
  ){

    turnOffScanner();

    moveToRoom(
      room
    );

    return;

  }


  openEncounter(
    room
  );

}


/* =========================================================
   END
   ========================================================= */

function triggerGameOver(){

  if(
    state.ended
  ){
    return;
  }

  state.ended =
    true;

  state.gameLocked =
    true;

  turnOffScanner();

  encounter.classList.remove(
    "show"
  );

  gameOverSound();

  endOverlay.className =
    "show gameover";

  endTitle.textContent =
    "GAME OVER";

  endSubtitle.textContent =
    "Te has quedado sin oxígeno.";

}


function missionComplete(){

  if(
    state.ended
  ){
    return;
  }

  state.ended =
    true;

  state.gameLocked =
    true;

  turnOffScanner();

  encounter.classList.remove(
    "show"
  );

  missionSound();

  endOverlay.className =
    "show mission";

  endTitle.textContent =
    "MISIÓN CUMPLIDA";

  endSubtitle.textContent =
    "Has abierto la bóveda y recuperado el botín.";

}


/* =========================================================
   MOBILE DOUBLE ZOOM
   ========================================================= */

let lastTouchEnd =
  0;


document.addEventListener(

  "touchend",

  event => {

    const now =
      Date.now();

    if(
      now
      -
      lastTouchEnd
      <=
      300
    ){

      event.preventDefault();

    }

    lastTouchEnd =
      now;

  },

  {
    passive:false
  }

);

</script>
