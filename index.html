<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MPL - Estación Espacial</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#050713;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;touch-action:manipulation}
body{display:flex;justify-content:center;align-items:flex-start}
#game{position:relative;width:min(100vw,760px);margin:0 auto;overflow:hidden;background:#050713;user-select:none;-webkit-user-select:none}
#map{position:relative;width:100%}
#mapImage{display:block;width:100%;height:auto;pointer-events:none}
.room{position:absolute;z-index:20;cursor:pointer}
#roomA12{left:43%;top:61.4%;width:15.2%;height:7.6%}
#roomB5{left:43%;top:51.7%;width:15.2%;height:7.6%}
#roomB6{left:26%;top:61.4%;width:14.8%;height:7.6%}
#roomB7{left:60.2%;top:61.4%;width:14.8%;height:7.6%}
#scannerButton{position:absolute;left:38%;top:89.3%;width:24%;height:8.9%;z-index:25;cursor:pointer;animation:scannerPulse 1.8s infinite ease-in-out}
#scannerButton.scanner-on{animation:scannerOn .9s infinite ease-in-out}
@keyframes scannerPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
@keyframes scannerOn{0%,100%{filter:brightness(1.15) drop-shadow(0 0 5px #a8d336)}50%{filter:brightness(1.4) drop-shadow(0 0 15px #a8d336)}}
#musicButton{position:absolute;top:12px;right:12px;z-index:70;min-height:44px;padding:8px 14px;border:2px solid #a8d336;border-radius:24px;background:rgba(10,15,20,.88);color:#fff;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 12px rgba(168,211,54,.25)}
#musicButton:active{transform:scale(.94)}
#musicButton.music-on{background:rgba(130,170,30,.92);box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 18px rgba(168,211,54,.7)}
#iconsLayer{position:absolute;inset:0;z-index:30;pointer-events:none}
.map-icon{position:absolute;pointer-events:none;object-fit:contain}
.pos-A12{left:50.6%;top:65.2%}.pos-B5{left:50.5%;top:55.5%}.pos-B6{left:33.4%;top:65.1%}.pos-B7{left:67.7%;top:65.1%}
.player-icon{width:13%;transform:translate(-50%,-50%);animation:pop .35s ease-out;filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
.event-icon{width:12.5%;transform:translate(-50%,-50%);animation:pop .35s ease-out}
.check-icon{width:11.5%;transform:translate(-50%,-50%);animation:pop .35s ease-out}
.scanner-wave{width:9%;animation:waveGlow 1s infinite ease-in-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.25)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes waveGlow{0%,100%{opacity:.62;filter:brightness(.95)}50%{opacity:1;filter:brightness(1.22)}}
.dir-up{transform:translate(-50%,-50%) rotate(0)}.dir-right{transform:translate(-50%,-50%) rotate(90deg)}.dir-left{transform:translate(-50%,-50%) rotate(-90deg)}.dir-down{transform:translate(-50%,-50%) rotate(180deg)}
#encounter{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:center;padding:12px;background:rgba(0,0,0,.62);opacity:0;visibility:hidden;transform:scale(.96);transition:opacity .2s ease,transform .2s ease}
#encounter.show{opacity:1;visibility:visible;transform:scale(1)}
#encounterCard{position:relative;width:min(82vw,650px);max-height:94vh;cursor:default}
#encounterImage{display:block;width:100%;height:auto;max-height:94vh;object-fit:contain;pointer-events:none}
.attack-zone{position:absolute;z-index:120;border:0;background:transparent;cursor:pointer;display:none}
#gunButton{left:8%;top:54%;width:30%;height:22%}
#fistButton{left:66%;top:54%;width:29%;height:22%}
#enemyHp{position:absolute;z-index:125;left:82.2%;top:13.8%;transform:translate(-50%,-50%);display:none;min-width:44px;height:44px;padding:0 10px;border-radius:24px;align-items:center;justify-content:center;background:rgba(0,0,0,.82);border:3px solid #fff;color:#fff;font-size:clamp(22px,5vw,34px);font-weight:900;text-shadow:2px 2px 0 #000,-2px -2px 0 #000;pointer-events:none}
#encounterCard.combat #gunButton,#encounterCard.combat #fistButton,#encounterCard.combat #enemyHp{display:flex}
#encounterCard.hit{animation:cardHit .22s ease}
@keyframes cardHit{0%{transform:scale(1)}45%{transform:scale(.985)}100%{transform:scale(1)}}
#message{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);z-index:200;min-width:240px;max-width:85vw;padding:17px 25px;border-radius:18px;background:rgba(15,18,22,.95);border:3px solid #a8d336;color:#fff;font-size:clamp(20px,4.6vw,36px);font-weight:900;line-height:1.15;text-align:center;opacity:0;visibility:hidden;box-shadow:0 0 0 3px rgba(0,0,0,.55),0 0 25px rgba(168,211,54,.45);pointer-events:none}
#message.show{visibility:visible;animation:messageAnimation 1.35s ease forwards}
@keyframes messageAnimation{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}72%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-95%) scale(.95)}}
@media(max-width:500px){#musicButton{top:8px;right:8px;min-height:40px;padding:6px 10px;font-size:12px}}
@media(min-width:900px){#encounterCard{width:min(58vh,610px)}}
</style>
</head>
<body>
<div id="game"><div id="map">
<img id="mapImage" src="FN1.png" alt="Estación espacial MPL" draggable="false">
<button id="musicButton" type="button" aria-label="Activar música">♫ MÚSICA</button>
<div id="roomA12" class="room" aria-label="Habitación A12"></div>
<div id="roomB5" class="room" aria-label="Habitación B5"></div>
<div id="roomB6" class="room" aria-label="Habitación B6"></div>
<div id="roomB7" class="room" aria-label="Habitación B7"></div>
<div id="scannerButton" aria-label="Escáner"></div>
<div id="iconsLayer"></div>
</div></div>
<audio id="bgMusic" loop preload="auto"><source src="Bitácotas Espaciales.mp3" type="audio/mpeg"></audio>
<div id="encounter"><div id="encounterCard">
<img id="encounterImage" src="" alt="Encuentro" draggable="false">
<div id="enemyHp" aria-live="polite"></div>
<button id="gunButton" class="attack-zone" type="button" aria-label="Disparar con la pistola"></button>
<button id="fistButton" class="attack-zone" type="button" aria-label="Golpear con el puño"></button>
</div></div>
<div id="message"></div>
<script>
const DEFINITIONS={
 A12:{card:'A12E.png',icon:'ICOA12.png',type:'combat',label:'MARCIANO VERDE',hp:1,finalCard:'A12F.png'},
 B1:{card:'B1E.png',icon:'ICOB1.png',type:'simple',label:'TRAMPA DE ENERGÍA'},
 B2:{card:'B2E.png',icon:'ICOB2.png',type:'simple',label:'TRAMPA EXPLOSIVA'},
 B3:{card:'B3E.png',icon:'ICOB3.png',type:'simple',label:'OBJETO MISTERIOSO'},
 B4:{card:'B4E.png',icon:'ICOB4.png',type:'simple',label:'KIT DE CURACIÓN'},
 B5:{card:'B5E.png',icon:'ICOB5.png',type:'combat',label:'MARCIANO NARANJA',hp:3,finalCard:'B5F.png'},
 B6:{card:'B6E.png',icon:'ICOB6.png',type:'combat',label:'MARCIANO NARANJA',hp:3,finalCard:'BF6.png'},
 B7:{card:'B7E.png',icon:'ICOB7.png',type:'combat',label:'MARCIANO MORADO',hp:2,finalCard:'B7F.png'}
};
const state={currentRoom:'ENTRADA',scannerActive:false,pendingRoom:null,encounterMode:null,combat:null,rooms:{A12:{eventId:'A12',revealed:false,completed:false},B5:{eventId:null,revealed:false,completed:false},B6:{eventId:null,revealed:false,completed:false},B7:{eventId:null,revealed:false,completed:false}}};
const iconsLayer=document.getElementById('iconsLayer');
const scannerButton=document.getElementById('scannerButton');
const encounter=document.getElementById('encounter');
const encounterCard=document.getElementById('encounterCard');
const encounterImage=document.getElementById('encounterImage');
const enemyHp=document.getElementById('enemyHp');
const gunButton=document.getElementById('gunButton');
const fistButton=document.getElementById('fistButton');
const message=document.getElementById('message');
const bgMusic=document.getElementById('bgMusic');
const musicButton=document.getElementById('musicButton');
let messageTimer=null,musicPlaying=false,combatLocked=false;
bgMusic.volume=.32;
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function prepareBRooms(){const draw=shuffle(['B1','B2','B3','B4','B5','B6','B7']).slice(0,3);['B5','B6','B7'].forEach((room,i)=>state.rooms[room].eventId=draw[i])}
prepareBRooms();
function showMessage(html){clearTimeout(messageTimer);message.classList.remove('show');void message.offsetWidth;message.innerHTML=html;message.classList.add('show');messageTimer=setTimeout(()=>message.classList.remove('show'),1350)}
async function toggleMusic(){if(!musicPlaying){try{await bgMusic.play();musicPlaying=true;musicButton.classList.add('music-on');musicButton.textContent='♫ MÚSICA ON';musicButton.setAttribute('aria-label','Desactivar música')}catch(e){showMessage('NO SE PUDO<br>ACTIVAR LA MÚSICA')}return}bgMusic.pause();musicPlaying=false;musicButton.classList.remove('music-on');musicButton.textContent='♫ MÚSICA';musicButton.setAttribute('aria-label','Activar música')}
musicButton.addEventListener('click',e=>{e.stopPropagation();toggleMusic()});
function createAudioContext(){const C=window.AudioContext||window.webkitAudioContext;return new C()}
function scannerSound(){try{const c=createAudioContext(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(480,c.currentTime);o.frequency.linearRampToValueAtTime(980,c.currentTime+.28);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.4)}catch(e){}}
function deathSound(){try{const c=createAudioContext(),n=c.currentTime;[430,300,180,95].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i<2?'square':'sawtooth';o.frequency.setValueAtTime(f,n+i*.09);g.gain.setValueAtTime(.13,n+i*.09);g.gain.exponentialRampToValueAtTime(.001,n+.22+i*.09);o.connect(g);g.connect(c.destination);o.start(n+i*.09);o.stop(n+.25+i*.09)})}catch(e){}}
function addMapIcon(id,image,room,classes){removeMapIcon(id);const icon=document.createElement('img');icon.id=id;icon.src=image;icon.draggable=false;icon.className=`map-icon pos-${room} ${classes}`;iconsLayer.appendChild(icon);return icon}
function removeMapIcon(id){const el=document.getElementById(id);if(el)el.remove()}
function getAdjacentRooms(room){if(room==='ENTRADA')return[{room:'A12',direction:'up'}];if(room==='A12')return[{room:'B5',direction:'up'},{room:'B6',direction:'left'},{room:'B7',direction:'right'}];if(room==='B5')return[{room:'A12',direction:'down'}];if(room==='B6')return[{room:'A12',direction:'right'}];if(room==='B7')return[{room:'A12',direction:'left'}];return[]}
function roomIsAdjacent(roomName){return getAdjacentRooms(state.currentRoom).some(c=>c.room===roomName)}
function roomDefinition(roomName){const r=state.rooms[roomName];return r?DEFINITIONS[r.eventId]:null}
function refreshMarkers(){removeMapIcon('player-marker');['A12','B5','B6','B7'].forEach(r=>removeMapIcon(`check-${r}`));if(state.currentRoom!=='ENTRADA')addMapIcon('player-marker','IcoAstra.png',state.currentRoom,'player-icon');['A12','B5','B6','B7'].forEach(r=>{if(state.rooms[r].completed&&state.currentRoom!==r)addMapIcon(`check-${r}`,'icocheck.png',r,'check-icon')})}
function moveToRoom(roomName){state.currentRoom=roomName;removeMapIcon(`event-${roomName}`);removeMapIcon(`scan-${roomName}`);refreshMarkers()}
function turnOffScanner(){state.scannerActive=false;scannerButton.classList.remove('scanner-on');['A12','B5','B6','B7'].forEach(r=>removeMapIcon(`scan-${r}`))}
function scanNearbyRooms(){if(state.scannerActive){turnOffScanner();return}const adjacent=getAdjacentRooms(state.currentRoom);let count=0;adjacent.forEach(({room,direction})=>{const r=state.rooms[room];if(r&&!r.completed&&!r.revealed){addMapIcon(`scan-${room}`,'Esc1.png',room,`scanner-wave dir-${direction}`);count++}});if(!count){showMessage('SIN NUEVAS<br>SEÑALES');return}state.scannerActive=true;scannerButton.classList.add('scanner-on');scannerSound()}
scannerButton.addEventListener('click',scanNearbyRooms);
function revealRoom(roomName){const r=state.rooms[roomName],def=roomDefinition(roomName);if(!r||!def)return;r.revealed=true;removeMapIcon(`scan-${roomName}`);addMapIcon(`event-${roomName}`,def.icon,roomName,'event-icon');showMessage(`${def.label}<br>−2 ENERGÍAS`)}
function resetEncounterUI(){encounterCard.className='';encounterCard.style.cursor='default';enemyHp.style.display='none';gunButton.style.display='none';fistButton.style.display='none';combatLocked=false;state.combat=null}
function openEncounter(roomName){const def=roomDefinition(roomName);if(!def)return;turnOffScanner();state.pendingRoom=roomName;state.encounterMode=def.type;resetEncounterUI();encounterImage.src=def.card;encounter.classList.add('show');if(def.type==='combat'){encounterCard.classList.add('combat');enemyHp.style.display='flex';gunButton.style.display='block';fistButton.style.display='block';state.combat={eventId:state.rooms[roomName].eventId,hp:def.hp,fists:0,shots:0};enemyHp.textContent=def.hp}else if(def.type==='simple'){encounterCard.style.cursor='pointer'}}
function completeCurrentRoom(){const roomName=state.pendingRoom;if(!roomName)return;const r=state.rooms[roomName];r.completed=true;r.revealed=true;removeMapIcon(`event-${roomName}`);removeMapIcon(`scan-${roomName}`);encounter.classList.remove('show');state.pendingRoom=null;state.encounterMode=null;resetEncounterUI();moveToRoom(roomName)}
function animateHit(){encounterCard.classList.remove('hit');void encounterCard.offsetWidth;encounterCard.classList.add('hit')}
function attack(kind){if(state.encounterMode!=='combat'||combatLocked||!state.combat)return;combatLocked=true;const c=state.combat;if(kind==='fist'){c.fists++;showMessage('−1 VIDA')}else{c.shots++;showMessage('−1 ENERGÍA')}c.hp=Math.max(0,c.hp-1);enemyHp.textContent=c.hp;animateHit();setTimeout(()=>{if(c.hp>0){combatLocked=false;return}const def=DEFINITIONS[c.eventId];if(c.fists>c.shots&&def.finalCard){state.encounterMode='final';encounterCard.classList.remove('combat');enemyHp.style.display='none';gunButton.style.display='none';fistButton.style.display='none';encounterImage.src=def.finalCard;encounterCard.style.cursor='pointer';combatLocked=false;return}deathSound();setTimeout(()=>completeCurrentRoom(),450)},330)}
gunButton.addEventListener('click',e=>{e.stopPropagation();attack('gun')});
fistButton.addEventListener('click',e=>{e.stopPropagation();attack('fist')});
encounterCard.addEventListener('click',()=>{if(state.encounterMode==='simple'||state.encounterMode==='final')completeCurrentRoom()});
function handleRoomClick(roomName){const r=state.rooms[roomName];if(!r)return;if(state.currentRoom===roomName){showMessage('ESTÁS EN<br>ESTA SALA');return}if(!roomIsAdjacent(roomName))return;if(r.completed){turnOffScanner();moveToRoom(roomName);return}if(state.scannerActive&&!r.revealed){revealRoom(roomName);return}openEncounter(roomName)}
['A12','B5','B6','B7'].forEach(r=>document.getElementById(`room${r}`).addEventListener('click',()=>handleRoomClick(r)));
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});
</script>
</body>
</html>
