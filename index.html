<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>MPL - Estación Espacial</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #050713;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #game {
      position: relative;
      width: min(100vw, 760px);
      margin: 0 auto;
      overflow: hidden;
      background: #050713;
      user-select: none;
      -webkit-user-select: none;
    }

    #map {
      position: relative;
      width: 100%;
    }

    #mapImage {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    /* =========================
       CUARTOS TOCABLES
       ========================= */

    .room {
      position: absolute;
      z-index: 20;
      cursor: pointer;
    }

    #roomA12 {
      left: 42.7%;
      top: 62.0%;
      width: 14.6%;
      height: 7.8%;
    }

    #roomB5 {
      left: 42.7%;
      top: 54.2%;
      width: 14.6%;
      height: 7.8%;
    }

    #roomB6 {
      left: 27.9%;
      top: 62.0%;
      width: 14.6%;
      height: 7.8%;
    }

    #roomB7 {
      left: 57.5%;
      top: 62.0%;
      width: 14.6%;
      height: 7.8%;
    }

    /* =========================
       BOTÓN ESCÁNER
       ========================= */

    #scannerButton {
      position: absolute;
      left: 38%;
      top: 89.3%;
      width: 24%;
      height: 8.9%;
      z-index: 25;
      cursor: pointer;
      animation: scannerPulse 1.8s infinite ease-in-out;
    }

    @keyframes scannerPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }

    /* =========================
       CAPAS E ICONOS
       ========================= */

    #iconsLayer {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .map-icon {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      object-fit: contain;
    }

    .check-icon {
      width: 10.8%;
      animation: checkEnter 0.45s ease-out;
    }

    .scanner-wave {
      width: 8.5%;
      animation: waveGlow 1s infinite ease-in-out;
    }

    .enemy-icon {
      width: 8.7%;
      animation: popIn 0.35s ease-out;
    }

    @keyframes waveGlow {
      0%, 100% {
        opacity: 0.65;
        filter: brightness(0.95);
      }
      50% {
        opacity: 1;
        filter: brightness(1.18);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes checkEnter {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* posiciones centradas */
    .pos-A12 { left: 50%; top: 65.9%; }
    .pos-B5  { left: 50%; top: 58.2%; }
    .pos-B6  { left: 35.3%; top: 65.9%; }
    .pos-B7  { left: 64.7%; top: 65.9%; }

    /* direcciones de las ondas */
    .dir-up    { transform: translate(-50%, -50%) rotate(0deg); }
    .dir-right { transform: translate(-50%, -50%) rotate(90deg); }
    .dir-left  { transform: translate(-50%, -50%) rotate(-90deg); }
    .dir-down  { transform: translate(-50%, -50%) rotate(180deg); }

    /* =========================
       OSCURECER FONDO
       ========================= */

    #darkOverlay {
      position: absolute;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.58);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
    }

    #darkOverlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       ENCUENTRO A12
       ========================= */

    #encounter {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.94);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #encounter.show {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    #encounterCard {
      position: relative;
      width: min(82vw, 650px);
      max-height: 94vh;
    }

    #encounterImage {
      display: block;
      width: 100%;
      height: auto;
      max-height: 94vh;
      object-fit: contain;
      pointer-events: none;
    }

    #heartButton {
      position: absolute;
      left: 76%;
      top: 60%;
      width: 21%;
      height: 19%;
      z-index: 120;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #heartCounter {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.78);
      border: 3px solid white;
      color: white;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
      pointer-events: none;
    }

    #heartButton.hit {
      animation: heartHit 0.3s ease;
    }

    @keyframes heartHit {
      0% { transform: scale(1); }
      40% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* =========================
       MENSAJES
       ========================= */

    #message {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%) scale(0.8);
      z-index: 200;
      min-width: 240px;
      padding: 16px 24px;
      border-radius: 18px;
      background: rgba(15, 18, 22, 0.94);
      border: 3px solid #a8d336;
      color: white;
      font-size: clamp(20px, 4.6vw, 36px);
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
      opacity: 0;
      visibility: hidden;
      box-shadow:
        0 0 0 3px rgba(0,0,0,0.55),
        0 0 25px rgba(168,211,54,0.45);
      pointer-events: none;
    }

    #message.show {
      visibility: visible;
      animation: messageAnimation 1.3s ease forwards;
    }

    @keyframes messageAnimation {
      0% {
        opacity: 0;
        transform: translate(-50%, -20%) scale(0.7);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.06);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -60%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -95%) scale(0.95);
      }
    }
  </style>
</head>
<body>

  <div id="game">
    <div id="map">
      <img id="mapImage" src="FN1.png" alt="Estación espacial MPL" draggable="false" />

      <div id="roomA12" class="room" data-room="A12"></div>
      <div id="roomB5" class="room" data-room="B5"></div>
      <div id="roomB6" class="room" data-room="B6"></div>
      <div id="roomB7" class="room" data-room="B7"></div>

      <div id="scannerButton" aria-label="Escáner"></div>

      <div id="iconsLayer"></div>
      <div id="darkOverlay"></div>
    </div>
  </div>

  <div id="encounter">
    <div id="encounterCard">
      <img id="encounterImage" src="A12.png" alt="Encuentro A12" draggable="false" />
      <div id="heartButton">
        <div id="heartCounter">1</div>
      </div>
    </div>
  </div>

  <div id="message"></div>

  <script>
    const state = {
      currentRoom: "ENTRADA",
      rooms: {
        A12: {
          status: "hidden",
          encounter: "icoM1.png",
          label: "MARCIANO VERDE"
        },
        B5: {
          status: "hidden",
          encounter: null,
          label: ""
        },
        B6: {
          status: "hidden",
          encounter: null,
          label: ""
        },
        B7: {
          status: "hidden",
          encounter: null,
          label: ""
        }
      }
    };

    const iconsLayer = document.getElementById("iconsLayer");
    const scannerButton = document.getElementById("scannerButton");
    const darkOverlay = document.getElementById("darkOverlay");
    const encounter = document.getElementById("encounter");
    const heartButton = document.getElementById("heartButton");
    const heartCounter = document.getElementById("heartCounter");
    const message = document.getElementById("message");

    let enemyLife = 1;
    let defeatingEnemy = false;
    let messageTimer;

    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function prepareBRooms() {
      const deck = shuffle([
        { img: "icoM1.png", label: "MARCIANO VERDE" },
        { img: "icoM1.png", label: "MARCIANO VERDE" },
        { img: "icoM2.png", label: "MARCIANO MORADO" }
      ]);

      ["B5", "B6", "B7"].forEach((room, index) => {
        state.rooms[room].encounter = deck[index].img;
        state.rooms[room].label = deck[index].label;
      });
    }

    prepareBRooms();

    function createAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      return new AudioContext();
    }

    function deathSound() {
      try {
        const ctx = createAudioContext();
        const now = ctx.currentTime;
        const frequencies = [430, 300, 180, 95];

        frequencies.forEach((frequency, index) => {
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = index < 2 ? "square" : "sawtooth";
          oscillator.frequency.setValueAtTime(frequency, now + index * 0.09);
          gain.gain.setValueAtTime(0.13, now + index * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22 + index * 0.09);

          oscillator.connect(gain);
          gain.connect(ctx.destination);

          oscillator.start(now + index * 0.09);
          oscillator.stop(now + 0.25 + index * 0.09);
        });
      } catch (error) {}
    }

    function scannerSound() {
      try {
        const ctx = createAudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(500, ctx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(950, ctx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.35);
      } catch (error) {}
    }

    function showMessage(html) {
      clearTimeout(messageTimer);
      message.classList.remove("show");
      void message.offsetWidth;
      message.innerHTML = html;
      message.classList.add("show");

      messageTimer = setTimeout(() => {
        message.classList.remove("show");
      }, 1300);
    }

    function addMapIcon(id, image, room, classes) {
      const oldIcon = document.getElementById(id);
      if (oldIcon) oldIcon.remove();

      const icon = document.createElement("img");
      icon.id = id;
      icon.src = image;
      icon.draggable = false;
      icon.className = `map-icon pos-${room} ${classes}`;
      iconsLayer.appendChild(icon);
      return icon;
    }

    function removeMapIcon(id) {
      const icon = document.getElementById(id);
      if (icon) icon.remove();
    }

    function getAdjacentRooms(currentRoom) {
      if (currentRoom === "ENTRADA") {
        return [
          { room: "A12", direction: "up" }
        ];
      }

      if (currentRoom === "A12") {
        return [
          { room: "B5", direction: "up" },
          { room: "B6", direction: "left" },
          { room: "B7", direction: "right" }
        ];
      }

      return [];
    }

    function scanNearbyRooms() {
      const adjacent = getAdjacentRooms(state.currentRoom);

      if (!adjacent.length) {
        showMessage("ZONA NO<br>PROGRAMADA");
        return;
      }

      scannerSound();

      adjacent.forEach(({ room, direction }) => {
        const roomData = state.rooms[room];
        if (!roomData) return;

        if (roomData.status === "hidden") {
          roomData.status = "scannable";
          roomData.direction = direction;

          addMapIcon(
            `scan-${room}`,
            "Esc1.png",
            room,
            `scanner-wave dir-${direction}`
          );
        }
      });
    }

    function openA12Encounter() {
      enemyLife = 1;
      defeatingEnemy = false;
      heartCounter.textContent = enemyLife;
      encounter.classList.add("show");
      darkOverlay.classList.add("show");
    }

    function completeA12() {
      encounter.classList.remove("show");
      darkOverlay.classList.remove("show");

      state.rooms.A12.status = "completed";
      state.currentRoom = "A12";

      removeMapIcon("scan-A12");
      removeMapIcon("enemy-A12");

      addMapIcon(
        "check-A12",
        "icocheck.png",
        "A12",
        "check-icon"
      );
    }

    function handleRoomClick(roomName) {
      const room = state.rooms[roomName];
      if (!room) return;

      if (room.status === "hidden") {
        return;
      }

      if (room.status === "scannable") {
        room.status = "revealed";
        removeMapIcon(`scan-${roomName}`);
        addMapIcon(`enemy-${roomName}`, room.encounter, roomName, "enemy-icon");

        if (roomName === "A12") {
          showMessage("HAY UN<br>MARCIANO VERDE");
        } else {
          showMessage(`${room.label}<br>−2 ENERGÍAS`);
        }
        return;
      }

      if (room.status === "revealed") {
        if (roomName === "A12") {
          openA12Encounter();
        } else {
          state.currentRoom = roomName;
          room.status = "entered";
          showMessage(`ENTRASTE A<br>${roomName}`);
        }
        return;
      }

      if (room.status === "completed") {
        showMessage("CUARTO<br>COMPLETADO");
      }
    }

    scannerButton.addEventListener("click", scanNearbyRooms);

    document.getElementById("roomA12").addEventListener("click", () => handleRoomClick("A12"));
    document.getElementById("roomB5").addEventListener("click", () => handleRoomClick("B5"));
    document.getElementById("roomB6").addEventListener("click", () => handleRoomClick("B6"));
    document.getElementById("roomB7").addEventListener("click", () => handleRoomClick("B7"));

    heartButton.addEventListener("click", () => {
      if (defeatingEnemy || enemyLife <= 0) return;

      enemyLife--;
      heartCounter.textContent = enemyLife;

      heartButton.classList.remove("hit");
      void heartButton.offsetWidth;
      heartButton.classList.add("hit");

      if (enemyLife === 0) {
        defeatingEnemy = true;
        deathSound();

        setTimeout(() => {
          completeA12();
        }, 650);
      }
    });

    let lastTouchEnd = 0;
    document.addEventListener(
      "touchend",
      function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      },
      { passive: false }
    );
  </script>
</body>
</html>
